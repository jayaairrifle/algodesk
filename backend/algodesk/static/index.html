<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlgoDesk MT5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: top bar + fixed sidebar + dense panel grid, dark trading-desk look taken from the AlgoDesk mock */
:root {
  color-scheme: dark;
  --bg: #0f1216;
  --panel: #151a20;
  --panel-2: #1a2027;
  --line: #252c35;
  --line-soft: #1e242c;
  --fg: #e7eaee;
  --fg-2: #b3bac4;
  --muted: #7d8695;
  --accent: #5fd3a4;
  --accent-bg: #173328;
  --up: #4fd39a;
  --up-bg: #12322a;
  --down: #f2697a;
  --down-bg: #3a1a22;
  --warn: #f2c14e;
  --warn-bg: #3a3016;
  --blue: #8aa4f8;
  --purple: #b18cf7;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef1f4; --panel: #ffffff; --panel-2: #f5f7f9; --line: #dde2e8; --line-soft: #e9edf1;
    --fg: #141a21; --fg-2: #3b4552; --muted: #6b7584;
    --accent: #128a5c; --accent-bg: #ddf3ea; --up: #12865a; --up-bg: #dcf2e8;
    --down: #cc2f45; --down-bg: #fbe3e7; --warn: #a8740a; --warn-bg: #fbefd2;
    --blue: #3d5fd6; --purple: #7a4bd8;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f5f7f9; --line: #dde2e8; --line-soft: #e9edf1;
  --fg: #141a21; --fg-2: #3b4552; --muted: #6b7584;
  --accent: #128a5c; --accent-bg: #ddf3ea; --up: #12865a; --up-bg: #dcf2e8;
  --down: #cc2f45; --down-bg: #fbe3e7; --warn: #a8740a; --warn-bg: #fbefd2;
  --blue: #3d5fd6; --purple: #7a4bd8;
}
* { box-sizing: border-box; }
svg { width: 16px; height: 16px; flex: none; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 16px; flex-wrap: wrap; color: var(--muted); display: flex; gap: 10px; flex: 1; min-width: 0; }
.crumb b { color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.demo { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.g { color: var(--up); } .dot.r { color: var(--down); } .dot.y { color: var(--warn); } .dot.b { color: var(--blue); } .dot.p { color: var(--purple); }
.user { position: relative; }
.user > button { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; text-align: left; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.user small { display: block; color: var(--muted); font-size: 12px; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; min-width: 220px; z-index: 20; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
.menu p { margin: 4px 8px 6px; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.menu button { display: flex; width: 100%; justify-content: space-between; background: none; border: 0; padding: 8px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--panel-2); }

/* shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100% - 65px); }
.side { border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 12px; margin: 0 4px 24px; font-weight: 700; letter-spacing: .12em; }
.brand i { font-style: normal; width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: #062a1c; display: grid; place-items: center; font-size: 18px; }
.brand span em { font-style: normal; color: var(--muted); }
.navh { font-size: 12px; letter-spacing: .14em; color: var(--muted); margin: 8px 6px 6px; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: var(--fg-2); background: none; border: 0; border-left: 2px solid transparent; cursor: pointer; text-align: left; width: 100%; }
.nav:hover { background: var(--panel-2); color: var(--fg); }
.nav.on { background: var(--accent-bg); color: var(--fg); border-left-color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .ct { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.navgroup { display: flex; flex-direction: column; gap: 4px; }
.vps { margin-top: auto; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--panel); }
.vps svg { width: 32px; height: 32px; color: var(--accent); flex: none; }
.vps b { display: block; font-size: 14px; }
.vps small { color: var(--fg-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.ver { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 14px 4px 0; }

main { padding-block: 28px 24px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.eyebrow { font-size: 13px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 20px; height: 1px; background: var(--muted); }
h1 { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }
.head p { margin: 0; color: var(--fg-2); }
.preview { text-align: right; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.preview span { flex-wrap: wrap; }
.preview .mono { letter-spacing: 0; color: var(--muted); font-size: 13px; text-transform: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.acct { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding: 14px 18px; }
.acct .it { display: flex; gap: 12px; align-items: center; }
.acct .it svg { width: 22px; height: 22px; color: var(--fg-2); flex: none; }
.acct b { font-weight: 600; font-size: 14px; display: block; }
.acct small { color: var(--fg-2); font-size: 13px; }
.acct .sep { width: 1px; align-self: stretch; background: var(--line); }
.acct .sync { margin-left: auto; color: var(--fg-2); font-size: 13px; display: flex; gap: 8px; align-items: center; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.kpi .lbl { display: flex; justify-content: space-between; color: var(--fg-2); }
.kpi .lbl svg { width: 20px; height: 20px; color: var(--muted); }
.kpi .val { font-family: var(--mono); font-size: clamp(18px, 1.7vw, 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 14px; color: var(--fg-2); margin-left: 6px; }
.kpi .sub { color: var(--fg-2); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }

.row { display: grid; gap: 12px; }
.r-mw { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.r-pos { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line-soft); }
.ph h2 { font-size: 15px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.ph p { margin: 4px 0 0 17px; color: var(--fg-2); font-size: 13px; }
.badge { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; color: var(--fg-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; cursor: pointer; color: var(--fg); white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.btn.ghost { background: none; border-color: transparent; }
.btn.primary { background: var(--accent); color: #062a1c; border-color: var(--accent); font-weight: 600; }
.btn.danger { background: var(--down-bg); color: var(--down); border-color: transparent; font-weight: 600; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
td { padding: 10px 18px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.sym { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.px { font-family: var(--mono); font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; transition: color .6s; }
.px .fu { color: var(--up); } .px .fd { color: var(--down); }
.struct { font-size: 13px; color: var(--fg-2); }
.struct b { font-weight: 500; }
.sig { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 4px; letter-spacing: .04em; }
.sig svg { width: 14px; height: 14px; }
.sig.buy { background: var(--up-bg); color: var(--up); }
.sig.sell { background: var(--down-bg); color: var(--down); }
.sig.none { background: var(--panel-2); color: var(--muted); }
.pf { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-soft); color: var(--fg-2); font-size: 13px; gap: 10px; flex-wrap: wrap; }
.pf .lnk { background: none; border: 0; color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.pf .lnk svg { width: 16px; height: 16px; }

/* protection */
.prot { padding-bottom: 18px; display: flex; flex-direction: column; }
.prot .ph { border-bottom: 0; }
.prot .body { padding: 0 18px; display: flex; flex-direction: column; gap: 14px; }
.state { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.active { color: var(--up); font-weight: 600; letter-spacing: .1em; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.active svg { width: 18px; height: 18px; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.pgrid small { color: var(--fg-2); font-size: 13px; }
.pgrid .num { font-size: 14px; font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--warn); border-radius: 3px; transition: width .6s; }
.bar.crit i { background: var(--down); }
.prow { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-2); gap: 8px; }
.note { display: flex; gap: 10px; color: var(--fg-2); font-size: 13px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--muted); }
.pause { width: 100%; justify-content: center; padding: 11px; font-size: 14px; }
.confirm { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.confirm div { display: flex; gap: 8px; justify-content: flex-end; }
.center { text-align: center; color: var(--muted); font-size: 13px; }

/* positions & EAs */
.pi { display: flex; gap: 12px; align-items: center; }
.pi .ic { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.pi .ic svg { width: 16px; height: 16px; }
.ic.b { background: var(--up-bg); color: var(--up); } .ic.s { background: var(--down-bg); color: var(--down); }
.pi b { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.pi .sd { font-size: 12px; color: var(--muted); margin-left: 8px; letter-spacing: .06em; }
.pi small { display: block; color: var(--fg-2); font-size: 13px; }
.mg { font-family: var(--mono); font-size: 13px; }
.mg small { display: block; font-family: var(--sans); color: var(--fg-2); }
.pl { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.ea { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); }
.ea .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.ea .ic svg { width: 18px; height: 18px; }
.ea b { font-weight: 600; display: block; }
.ea small { color: var(--fg-2); font-size: 13px; }
.ea .st { margin-left: auto; display: flex; gap: 14px; align-items: center; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.ea .st span { display: inline-flex; gap: 6px; align-items: center; font-family: var(--sans); font-size: 12px; letter-spacing: .08em; color: var(--fg-2); }
.lock { display: flex; gap: 10px; align-items: center; padding: 12px 18px; color: var(--fg-2); font-size: 13px; }
.lock svg { width: 16px; height: 16px; }

/* chart */
.chart { padding: 8px 18px 14px; }
.cw { position: relative; height: 170px; margin-left: 58px; }
.cw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.yl { position: absolute; left: -58px; font-family: var(--mono); font-size: 12px; color: var(--muted); transform: translateY(-50%); }
.xl { display: flex; justify-content: space-between; margin: 8px 0 0 58px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.endpt { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 25%, transparent); }
.agent .li { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line-soft); color: var(--fg-2); }
.agent .li:last-child { border-bottom: 0; }
.agent .li svg { width: 18px; height: 18px; flex: none; }
.agent .li span:last-child { margin-left: auto; color: var(--fg); }
.norm { color: var(--up); font-weight: 600; letter-spacing: .1em; font-size: 13px; display: flex; gap: 6px; align-items: center; }

.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--fg-2); font-size: 13px; }
.foot span { display: flex; gap: 8px; align-items: center; }


/* forms / generic */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 18px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg-2); }
input, select { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chip.g { background: var(--up-bg); color: var(--up); border-color: transparent; }
.chip.r { background: var(--down-bg); color: var(--down); border-color: transparent; }
.chip.y { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.log { font-family: var(--mono); font-size: 12px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--line); border: 0; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: left .2s; }
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 19px; background: #062a1c; }
.toggle[disabled] { opacity: .45; cursor: not-allowed; }
.pop { position: absolute; right: 18px; top: 56px; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 220px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
.rel { position: relative; }

.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100% - 32px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 24px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.err { border-left-color: var(--down); } .toast.wrn { border-left-color: var(--warn); }
@keyframes tin { from { transform: translateY(8px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .r-mw, .r-pos { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 4px; }
  .brand, .navh, .vps, .ver { display: none; }
  .navgroup { flex-direction: row; }
  .nav { width: auto; white-space: nowrap; padding: 8px 12px; border-left: 0; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .preview { align-items: flex-start; text-align: left; }
  .acct .sep { display: none; } .acct .sync { margin-left: 0; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .top .pill:not(.demo), .user small { display: none; }
  .crumb span.ws { display: none; }
  th, td { padding-left: 12px; padding-right: 12px; }
  .ea .st { flex-direction: column; align-items: flex-end; gap: 2px; }
}
body { margin: 0; }
[hidden] { display: none !important; }
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login form { width: min(380px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.login h1 { font-size: 22px; margin: 0; }
.login .err { color: var(--down); font-size: 13px; min-height: 18px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline input, .inline select { padding: 6px 8px; font-size: 13px; }
.offline { color: var(--down); font-weight: 600; letter-spacing: .1em; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.pill.real { background: var(--down-bg); color: var(--down); border-color: transparent; }
.pill.bad { color: var(--down); }
</style>
</head>
<body>

  <defs>

<script>
(() => {
  const ROLE_LABEL = { admin: 'Super Admin', trader: 'Trader', viewer: 'Viewer' };
  const CMD_LABEL = { pause_entry: 'Jeda entry', resume_entry: 'Lanjutkan entry', disable_magic: 'Nonaktifkan magic', enable_magic: 'Aktifkan magic', set_limit: 'Ubah batas rugi' };
  const STATUS_LABEL = { pending: 'Menunggu agent', acked: 'Dikonfirmasi agent', failed: 'Ditolak agent', expired: 'Kedaluwarsa' };
  const S = { cur: null, me: null, st: null, fetchedAt: 0, eq: [], eqHours: 24, cmds: [], users: [], view: 'overview', confirm: false, pending: null, prevBid: {}, dir: {}, timers: [] };

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = id => `<svg><use href="#${id}"/></svg>`;
  // ---------- currency ----------
  // Amounts arrive in the account currency (USD, USC/USDc cent accounts, IDR) and are shown in the
  // currency the viewer picks. USD/IDR comes from the broker's USDIDR symbol when it has one,
  // otherwise from the rate the viewer enters in Pengaturan. Both choices stay in this browser only.
  const pref = { get: k => { try { return localStorage.getItem('algodesk.' + k); } catch { return null; } },
                 set: (k, v) => { try { localStorage.setItem('algodesk.' + k, v); } catch {} } };
  const CURS = ['USD', 'USC', 'IDR'];
  S.cur = pref.get('cur');
  const normCur = c => { c = String(c || 'USD').toUpperCase(); return c.startsWith('USC') || c === 'USDC' ? 'USC' : c; };
  const brokerIdr = () => tel()?.fx?.usd_idr || 0;
  const manualIdr = () => parseFloat(pref.get('usdIdr')) || 0;
  const idrRate = () => brokerIdr() || manualIdr();
  const usdPer = c => c === 'USD' ? 1 : c === 'USC' ? 0.01 : c === 'IDR' && idrRate() ? 1 / idrRate() : null;
  const acctCur = () => normCur(tel()?.account?.currency);
  // The picked currency, or the account currency when conversion is impossible (IDR without a rate).
  const viewCur = () => { const c = S.cur || acctCur(); return usdPer(c) && usdPer(acctCur()) ? c : acctCur(); };
  const conv = v => { const from = usdPer(acctCur()), to = usdPer(viewCur()); return from && to ? v * from / to : v; };
  const fmtUsd = (v, sign) => {
    if (v == null) return '–';
    const cur = viewCur(), x = conv(v), dec = cur === 'IDR' ? 0 : 2;
    const n = Math.abs(x).toLocaleString(cur === 'IDR' ? 'id-ID' : 'en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return (x < 0 ? '−' : sign && x > 0 ? '+' : '') + (cur === 'USD' ? '$' + n : cur === 'IDR' ? 'Rp\u00a0' + n : n + '\u00a0' + cur);
  };
  // Short axis labels: $10.25k, Rp 168,4 jt, 1.02M USC.
  const fmtAxis = v => {
    const cur = viewCur(), x = conv(v);
    if (cur === 'IDR') return 'Rp ' + (x >= 1e9 ? (x / 1e9).toFixed(2) + ' M' : (x / 1e6).toFixed(1) + ' jt');
    const k = x >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : (x / 1e3).toFixed(2) + 'k';
    return cur === 'USD' ? '$' + k : k + ' ' + cur;
  };
  const fmtPx = (v, d) => v == null ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const hhmm = ts => new Date(ts * 1000).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  const hms = ts => new Date(ts * 1000).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const can = what => ({ control: ['admin', 'trader'], admin: ['admin'] }[what] || []).includes(S.me?.role);
  const tel = () => S.st?.telemetry;
  const ago = () => S.st?.agent?.age == null ? null : S.st.agent.age + (Date.now() - S.fetchedAt) / 1000;

  async function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
    const r = await fetch('/api' + path, init);
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== '/auth/login') { showLogin(); throw new Error(j.detail || 'Sesi berakhir'); }
    if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Permintaan gagal (HTTP ' + r.status + ')');
    return j;
  }
  function toast(msg, kind = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind; el.textContent = msg;
    $('toasts').appendChild(el); setTimeout(() => el.remove(), 4500);
  }

  // ---------- data views ----------
  const structHtml = s => s.structure === 'bull' ? `<span class="struct"><b class="up">HH · HL</b> Bullish</span>`
    : s.structure === 'bear' ? `<span class="struct"><b class="down">LH · LL</b> Bearish</span>`
    : `<span class="struct"><b>MIXED</b> Netral</span>`;
  const sigHtml = s => s.signal === 'BUY' ? `<span class="sig buy">${icon('i-up')}BUY</span>` : s.signal === 'SELL' ? `<span class="sig sell">${icon('i-down')}SELL</span>` : `<span class="sig none">–</span>`;
  const eaName = magic => S.st?.eas.find(e => e.magic === magic)?.name;

  function eaList() {
    const t = tel(), map = new Map();
    (S.st?.eas || []).forEach(e => map.set(e.magic, { ...e, known: true }));
    (t?.positions || []).forEach(p => { if (p.magic && !map.has(p.magic)) map.set(p.magic, { magic: p.magic, name: p.comment || 'Tanpa nama', scope: p.symbol, known: false }); });
    (t?.protection?.disabled_magics || []).forEach(m => { if (!map.has(m)) map.set(m, { magic: m, name: 'Tanpa nama', scope: '', known: false }); });
    return [...map.values()].sort((a, b) => a.magic - b.magic);
  }
  function eaStatus(magic) {
    const p = tel()?.protection;
    if (!p) return `<span><span class="dot" style="color:var(--muted)"></span>–</span>`;
    if ((p.disabled_magics || []).includes(magic)) return `<span><span class="dot" style="color:var(--muted)"></span>NONAKTIF</span>`;
    if (p.entry_state === 'blocked') return `<span class="down"><span class="dot r"></span>DIBLOKIR</span>`;
    if (p.entry_state === 'paused') return `<span class="warn"><span class="dot y"></span>DIJEDA</span>`;
    return `<span><span class="dot g"></span>AKTIF</span>`;
  }

  function marketCard(full) {
    const syms = tel()?.symbols || [];
    const list = full ? syms : syms.slice(0, 5);
    const rows = list.map(s => { const d = s.digits ?? 5, dir = S.dir[s.symbol]; return `<tr>
      <td><div class="sym">${esc(s.symbol)}</div><div class="px"><span class="${dir > 0 ? 'fu' : dir < 0 ? 'fd' : ''}">${fmtPx(s.bid, d)}</span> / ${fmtPx(s.ask, d)}</div>${structHtml(s)}</td>
      <td><div class="num">${s.rsi == null ? '–' : s.rsi.toFixed(1)}</div><div class="muted" style="font-size:13px">ATR ${s.atr_points == null ? '–' : s.atr_points.toFixed(1)} pt</div></td>
      <td class="num">${esc(s.spread)} <span class="muted">pt</span></td><td>${sigHtml(s)}</td></tr>`; }).join('');
    return `<section class="card">
      <div class="ph"><div><h2><span class="dot g"></span>Market Watch</h2><p>Semua simbol aktif · timeframe ${esc(tel()?.timeframe || '–')}</p></div></div>
      <div class="tw"><table><thead><tr><th>Instrumen</th><th>RSI / ATR</th><th>Spread</th><th>Sinyal</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="empty">Belum ada simbol dari agent.</td></tr>`}</tbody></table></div>
      <div class="pf"><span style="display:flex;gap:8px;align-items:center"><span class="dot g"></span>${syms.length} simbol terlihat di Market Watch</span>
      ${full ? '' : `<button class="lnk" data-go="market">Buka semua simbol ${icon('i-arrow')}</button>`}</div></section>`;
  }

  function protCard() {
    const p = tel()?.protection || {};
    const lim = p.limit_amount || 0, used = p.loss_used || 0, st = p.entry_state, pct = p.baseline ? used / p.baseline * 100 : 0;
    const online = S.st?.agent?.online;
    const stLine = st === 'allowed' ? `<span class="dot g"></span>Entry baru diizinkan`
      : st === 'paused' ? `<span class="dot y"></span><span class="warn">Entry dijeda manual</span>`
      : st === 'blocked' ? `<span class="dot r"></span><span class="down">Batas tercapai, entry baru diblokir</span>` : `<span class="dot"></span>Status belum diketahui`;
    let action;
    if (S.pending) action = `<button class="btn pause" disabled>${icon('i-sync')}Menunggu konfirmasi agent…</button>`;
    else if (S.confirm) action = `<div class="confirm"><span>${st === 'paused' ? 'Kirim perintah <b>lanjutkan entry</b> ke agent?' : 'Kirim perintah <b>jeda entry</b> ke semua EA di terminal ini? Posisi terbuka tidak ditutup.'}</span>
        <div><button class="btn" data-act="cancel">Batal</button><button class="btn primary" data-act="send">Kirim perintah</button></div></div>`;
    else if (st === 'blocked') action = `<button class="btn pause" disabled>${icon('i-lock')}Diblokir sampai reset harian</button>`;
    else action = `<button class="btn pause" data-act="pause" ${can('control') && online ? '' : 'disabled'}>${icon(st === 'paused' ? 'i-play' : 'i-pause')}${st === 'paused' ? 'Lanjutkan entry' : 'Jeda entry'}</button>`;
    const foot = !can('control') ? 'Peran Viewer tidak dapat mengirim perintah.' : !online ? 'Agent offline. Perintah dikirim setelah agent kembali.' : 'Perintah hanya dikirim melalui backend terautentikasi.';
    return `<section class="card prot">
      <div class="ph"><div><h2><span class="dot y"></span>Proteksi harian</h2><p>Baseline equity awal hari server${p.day_start ? ' · sejak ' + hhmm(p.day_start) : ''}</p></div>
      <span class="active">${icon('i-shield')}AKTIF</span></div>
      <div class="body">
        <div class="state">${stLine}</div>
        <div class="pgrid"><small>Equity awal hari</small><small>Batas rugi</small>
          <span class="num">${fmtUsd(p.baseline)}</span><span class="num">${p.limit_pct == null ? '–' : p.limit_pct.toFixed(2) + '%'} <span class="muted">(${fmtUsd(lim)})</span></span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="prow"><span>Penggunaan batas harian</span><span class="num" style="color:var(--fg)">${pct.toFixed(2)}% <span class="muted">/ ${(p.limit_pct || 0).toFixed(2)}%</span></span></div>
          <div class="bar ${st === 'blocked' ? 'crit' : ''}"><i style="width:${lim ? Math.min(100, used / lim * 100).toFixed(1) : 0}%"></i></div>
          <div class="prow"><span>Rugi tercatat <b class="num" style="color:var(--fg)">${fmtUsd(used)}</b></span><span>Sisa batas <b class="num" style="color:var(--fg)">${fmtUsd(Math.max(0, lim - used))}</b></span></div>
        </div>
        <div class="note">${icon('i-info')}<span>Proteksi memblokir entry baru saat batas tercapai. Posisi aktif tetap mengikuti SL/TP masing-masing EA.</span></div>
        ${action}<div class="center">${foot}</div>
      </div></section>`;
  }

  function posCard() {
    const ps = tel()?.positions || [];
    const rows = ps.map(p => { const d = p.digits ?? 5; return `<tr>
      <td><div class="pi"><span class="ic ${p.side === 'BUY' ? 'b' : 's'}">${icon(p.side === 'BUY' ? 'i-up' : 'i-down')}</span>
        <div><b>${esc(p.symbol)}</b><span class="sd">${esc(p.side)}</span><small>${Number(p.volume).toFixed(2)} lot · SL ${p.sl ? fmtPx(p.sl, d) : '–'} · TP ${p.tp ? fmtPx(p.tp, d) : '–'}</small></div></div></td>
      <td class="mg">${p.magic || 'Manual'}<small>${esc(eaName(p.magic) || p.comment || '')}</small></td>
      <td class="r pl ${p.profit < 0 ? 'down' : 'up'}">${fmtUsd(p.profit, true)}</td></tr>`; }).join('');
    return `<section class="card">
      <div class="ph"><div><h2><span class="dot b"></span>Posisi terbuka <span class="badge">${ps.length}</span></h2><p>Teridentifikasi menurut akun, simbol, dan Magic Number</p></div></div>
      <div class="tw"><table><thead><tr><th>Posisi</th><th>Magic Number</th><th class="r">P/L berjalan</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="3" class="empty">Tidak ada posisi terbuka.</td></tr>`}</tbody></table></div></section>`;
  }

  function eaCard() {
    const list = eaList();
    return `<section class="card">
      <div class="ph"><div><h2><span class="dot p"></span>Instansi EA <span class="badge">${list.length}</span></h2><p>Identitas strategi pada terminal ini</p></div>
      <button class="btn ghost" data-go="eas">Kelola ${icon('i-arrow')}</button></div>
      ${list.map(e => `<div class="ea"><span class="ic" style="color:var(--accent)">${icon('i-bot')}</span>
        <div><b>${esc(e.name)}</b><small>${esc(e.scope || '')}</small></div><div class="st">${e.magic} ${eaStatus(e.magic)}</div></div>`).join('')
        || `<div class="empty">Belum ada EA. Nama EA bisa didaftarkan di menu Instansi EA.</div>`}
      <div class="lock">${icon('i-lock')}Akses kontrol dikelola berdasarkan role pengguna.</div></section>`;
  }

  function chartCard(title, sub) {
    const pts = S.eq.map(s => [s.ts, s.equity]);
    const t = tel();
    if (t && S.st.agent.received_at) pts.push([S.st.agent.received_at, t.account.equity]);
    if (pts.length < 2) return `<section class="card"><div class="ph"><div><h2><span class="dot b"></span>${title}</h2><p>${sub}</p></div></div>
      <div class="empty">Grafik muncul setelah beberapa menit telemetri terkumpul.</div></section>`;
    const vals = pts.map(p => p[1]), base = t?.protection?.baseline;
    if (base) vals.push(base);
    const min = Math.min(...vals), max = Math.max(...vals), span = Math.max(max - min, 1);
    const rawStep = span / 4, mag = Math.pow(10, Math.floor(Math.log10(rawStep))), step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= rawStep);
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const t0 = pts[0][0], t1 = pts[pts.length - 1][0], W = 1000, H = 170;
    const x = ts => (ts - t0) / Math.max(1, t1 - t0) * W, y = v => H - (v - lo) / (hi - lo || 1) * H;
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
    const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
    const last = pts[pts.length - 1];
    const xl = [0, .25, .5, .75].map(f => hhmm(t0 + (t1 - t0) * f));
    return `<section class="card">
      <div class="ph" style="border-bottom:0"><div><h2><span class="dot b"></span>${title}</h2><p>${sub}</p></div></div>
      <div class="chart"><div class="cw">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Grafik equity">
          <defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".22"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
          ${ticks.map(v => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
          ${base ? `<line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".6"/>` : ''}
          <path d="${line}L${x(last[0])},${H}L0,${H}Z" fill="url(#eqg)"/>
          <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
        ${ticks.map(v => `<span class="yl" style="top:${(y(v) / H * 100).toFixed(2)}%">${fmtAxis(v)}</span>`).join('')}
        <span class="endpt" style="left:${(x(last[0]) / W * 100).toFixed(2)}%;top:${(y(last[1]) / H * 100).toFixed(2)}%" title="${fmtUsd(last[1])}"></span>
      </div>
      <div class="xl">${xl.map(l => `<span>${l}</span>`).join('')}<span>SEKARANG</span></div>
      ${base ? `<div class="muted" style="font-size:12px;margin:8px 0 0 58px;display:flex;gap:8px;align-items:center"><span style="width:14px;border-top:1px dashed var(--warn)"></span>Equity awal hari ${fmtUsd(base)}</div>` : ''}
      </div></section>`;
  }

  function agentCard() {
    const a = S.st?.agent, t = tel(), age = ago();
    const secure = location.protocol === 'https:';
    return `<section class="card agent">
      <div class="ph"><div><h2><span class="dot ${a?.online ? 'g' : 'r'}"></span>Status agent</h2><p>${esc(a?.agent_id || '–')} · terminal MT5</p></div>
      ${a?.online ? `<span class="norm"><span class="dot"></span>NORMAL</span>` : `<span class="offline"><span class="dot"></span>OFFLINE</span>`}</div>
      <div class="li">${icon('i-plug')}<span>Terminal MT5</span><span>${t ? (t.terminal_connected ? 'Terhubung' : 'Terputus dari broker') : '–'}</span></div>
      <div class="li">${icon('i-shield')}<span>Kredensial agent</span><span>${a?.received_at ? 'Terverifikasi (HMAC)' : 'Belum pernah terhubung'}</span></div>
      <div class="li">${icon('i-sync')}<span>Telemetri terakhir</span><span id="telAgo">${age == null ? '–' : Math.round(age) + ' detik lalu'}</span></div>
      <div class="li">${icon('i-lock')}<span>Kanal kontrol</span><span class="${secure ? '' : 'warn'}">${secure ? 'HTTPS · RBAC' : 'HTTP · pasang HTTPS'}</span></div></section>`;
  }

  function kpis() {
    const t = tel(); if (!t) return '';
    // Today's P/L as MT5 shows it: closed deals since the day start plus open positions.
    // Older agents send no "pl"; fall back to the equity change since the baseline.
    const a = t.account, p = t.protection || {}, d = t.pl;
    const pl = d ? d.realized + d.floating : p.baseline ? a.equity - p.baseline : null;
    const plSub = d
      ? `<span>Tertutup <span class="num ${d.realized < 0 ? 'down' : 'up'}">${fmtUsd(d.realized, true)}</span></span><span>Berjalan <span class="num ${d.floating < 0 ? 'down' : 'up'}">${fmtUsd(d.floating, true)}</span></span>`
      : `<span class="num ${pl < 0 ? 'down' : 'up'}">${pl == null ? '–' : (pl / p.baseline * 100).toFixed(2) + '%'}</span> dari equity awal hari`;
    const magics = new Set((t.positions || []).map(x => x.magic)).size;
    return `<div class="kpis">
      <div class="card kpi"><div class="lbl">Equity akun ${icon('i-wallet')}</div><div class="val">${fmtUsd(a.equity)}</div><div class="sub"><span class="dot b"></span>Balance <span class="num">${fmtUsd(a.balance)}</span></div></div>
      <div class="card kpi"><div class="lbl">P/L hari ini ${icon(pl < 0 ? 'i-down' : 'i-up')}</div><div class="val ${pl < 0 ? 'down' : 'up'}">${fmtUsd(pl, true)}</div><div class="sub">${plSub}</div></div>
      <div class="card kpi"><div class="lbl">Margin bebas ${icon('i-coin')}</div><div class="val">${fmtUsd(a.free_margin)}</div><div class="sub"><span class="dot g"></span>Margin level <span class="num">${a.margin_level ? a.margin_level.toFixed(1) + '%' : '–'}</span></div></div>
      <div class="card kpi"><div class="lbl">Posisi terbuka ${icon('i-layers')}</div><div class="val">${String((t.positions || []).length).padStart(2, '0')}<small>posisi</small></div><div class="sub"><span class="dot g"></span>${magics} Magic Number terpantau</div></div>
    </div>`;
  }

  function acctBar() {
    const t = tel(), a = S.st?.agent, agents = S.st?.agents || [];
    const sync = a?.online ? `<span class="dot g"></span>Sinkronisasi normal` : `<span class="dot r"></span><span class="down">Agent offline${ago() != null ? ', data terakhir ' + Math.round(ago()) + ' detik lalu' : ''}</span>`;
    return `<section class="card acct">
      <div class="it">${icon('i-bank')}<div><b>${t ? esc(t.account.login) + ' · ' + (t.account.demo ? 'Akun Demo' : 'Akun Real') : 'Belum ada data akun'}</b><small>${t ? esc(t.account.server) + ' • ' + esc(t.account.currency) : '–'}</small></div></div>
      <span class="sep"></span>
      <div class="it">${icon('i-shield')}<div><b>API terautentikasi</b><small>RBAC aktif · ${agents.length} agent terdaftar</small></div></div>
      <span class="sync">${sync}</span></section>`;
  }

  function emptyState() {
    return `<section class="card"><div class="empty" style="padding:40px 18px;display:flex;flex-direction:column;gap:8px;align-items:center">
      <b style="color:var(--fg);font-size:16px">Menunggu telemetri pertama dari agent</b>
      <span>${(S.st?.agents || []).length ? 'Pasang AlgoDeskAgent di terminal MT5 dengan URL backend, ID agent, dan rahasianya.' : 'Belum ada agent terdaftar. Jalankan <span class="mono">python -m algodesk.cli create-agent vps-01</span> di server.'}</span>

  const HEADS = {
    overview: ['Monitoring akun', 'Ringkasan', 'Pantau kondisi akun, simbol, dan perlindungan risiko dalam satu tempat.', 'Ikhtisar trading'],

    users: ['Administrasi', 'Pengguna & RBAC', 'Siapa yang bisa melihat dan siapa yang bisa mengirim perintah ke agent.', 'Pengguna & RBAC'],

        <span class="mono" style="display:flex;gap:6px;align-items:center">${icon('i-clock')}<span id="clock">${new Date().toLocaleTimeString('id-ID')}</span></span></div></div>`;

  function eaManage() {

    return `<section class="card">${list.map(e => `<div class="ea" style="flex-wrap:wrap">

        ${admin ? `<form class="inline" data-eaform="${e.magic}" style="flex:1;min-width:0">
            <input id="ean-${e.magic}" value="${esc(e.known ? e.name : '')}" placeholder="Nama EA" aria-label="Nama EA ${e.magic}" required maxlength="80">

      ${admin ? `<form class="inline" id="eaAdd" style="padding:14px 18px;border-top:1px solid var(--line-soft)">

      <div class="lock">${icon('i-lock')}${ctl ? 'Menonaktifkan EA hanya menghentikan entry baru dari Magic Number tersebut.' : 'Peran Viewer hanya dapat melihat status EA.'}</div></section>`;

      ${S.users.map(u => { const self = u.id === S.me.id, [, c, m] = perm(u.role); return `<tr>
        <td><b>${esc(u.display_name)}</b><div class="muted" style="font-size:13px">${esc(u.username)}${u.last_login ? ' · login ' + new Date(u.last_login * 1000).toLocaleString('id-ID') : ''}</div></td>
        <td><select data-urole="${u.id}" aria-label="Peran ${esc(u.username)}" ${self ? 'disabled' : ''}>${['admin', 'trader', 'viewer'].map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('')}</select></td>
        <td><span class="chip ${c === 'Ya' ? 'g' : ''}">${c}</span></td><td><span class="chip ${m === 'Ya' ? 'g' : ''}">${m}</span></td>
        <td><button class="toggle ${u.active ? 'on' : ''}" data-uactive="${u.id}" aria-label="Aktifkan ${esc(u.username)}" ${self ? 'disabled' : ''}></button></td>
        <td><form class="inline" data-upw="${u.id}"><input id="upw-${u.id}" type="password" minlength="10" placeholder="Sandi baru" aria-label="Sandi baru ${esc(u.username)}" required><button class="btn" type="submit">Atur</button></form></td></tr>`; }).join('')}
      </tbody></table></div></section>
      <section class="card"><div class="ph"><div><h2><span class="dot g"></span>Tambah pengguna</h2><p>Kata sandi minimal 10 karakter</p></div></div>
      <form id="userAdd" class="fgrid">
        <label>Nama pengguna<input id="nu-user" required pattern="[A-Za-z0-9_.\\-]{3,64}"></label>
        <label>Nama tampilan<input id="nu-name" required maxlength="80"></label>
        <label>Peran<select id="nu-role"><option value="viewer">Viewer</option><option value="trader">Trader</option><option value="admin">Super Admin</option></select></label>

  function settingsView() {
    const p = tel()?.protection;
    return `<section class="card"><div class="ph"><div><h2><span class="dot y"></span>Proteksi harian</h2><p>Dikirim sebagai perintah ke agent. Menaikkan batas tidak mencabut blokir yang sudah terjadi hari ini.</p></div></div>
      <form id="limitForm" class="fgrid">
        <label>Batas rugi harian (% dari equity awal)<input id="limIn" type="number" min="0.5" max="20" step="0.1" value="${p?.limit_pct ?? 3}" ${can('admin') ? '' : 'disabled'}></label>
        <div style="display:flex;align-items:flex-end"><button class="btn primary" type="submit" ${can('admin') && !S.pending ? '' : 'disabled'}>Kirim ke agent</button></div>
      </form>${can('admin') ? '' : '<div class="pf">Hanya Super Admin yang dapat mengubah batas rugi.</div>'}</section>
      <section class="card"><div class="ph"><div><h2><span class="dot g"></span>Mata uang tampilan</h2><p>Akun dalam ${esc(acctCur())}. USC = USD ÷ 100. Kurs USD/IDR ${brokerIdr() ? 'diambil otomatis dari simbol USDIDR broker: ' + brokerIdr().toLocaleString('id-ID') : 'tidak tersedia di broker, isi manual di bawah'}.</p></div></div>
      <form id="fxForm" class="fgrid">
        <label>Kurs manual 1 USD = … IDR<input id="fxIn" type="number" min="1000" max="100000" step="1" value="${manualIdr() || ''}" placeholder="mis. kurs hari ini" ${brokerIdr() ? 'disabled' : ''}></label>
        <div style="display:flex;align-items:flex-end"><button class="btn primary" type="submit" ${brokerIdr() ? 'disabled' : ''}>Simpan kurs</button></div>
      </form><div class="pf">Pilihan mata uang dan kurs manual tersimpan di browser ini saja.</div></section>
      <section class="card"><div class="ph"><div><h2><span class="dot b"></span>Log perintah</h2><p>Setiap perintah dicatat dengan pengirim, peran, dan konfirmasi agent</p></div></div>
      ${S.cmds.length ? `<div class="tw"><table class="log"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Perintah</th><th>Status</th><th>Hasil</th></tr></thead><tbody>
      ${S.cmds.map(c => `<tr><td>${hms(c.issued_at)}</td><td>${esc(c.issued_by)} <span class="muted">(${ROLE_LABEL[c.issued_role] || '–'})</span></td>
        <td>${CMD_LABEL[c.type] || esc(c.type)}${c.magic ? ' ' + c.magic : ''}${c.value != null ? ' ' + c.value + '%' : ''}</td>
        <td><span class="chip ${c.status === 'acked' ? 'g' : c.status === 'pending' ? 'y' : 'r'}">${STATUS_LABEL[c.status] || esc(c.status)}</span></td><td>${esc(c.result || '')}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Belum ada perintah.</div>`}</section>`;
  }

  function viewBody() {
    if (!tel() && !['users', 'settings'].includes(S.view)) return acctBar() + emptyState();
    switch (S.view) {
      case 'overview': return acctBar() + kpis()
        + `<div class="row r-mw">${marketCard(false)}${protCard()}</div>`
        + `<div class="row r-pos">${posCard()}${eaCard()}</div>`
        + `<div class="row r-pos">${chartCard('Equity hari ini', 'Perubahan intrahari · ' + viewCur() + ' · 24 jam')}${agentCard()}</div>`;
      case 'market': return marketCard(true);
      case 'positions': return kpis() + posCard();
      case 'eas': return eaManage() + protCard();
      case 'perf': return kpis() + chartCard('Equity 7 hari', 'Sampel tiap 30 detik dari telemetri agent');
      case 'users': return usersView();
      case 'settings': return settingsView();
    }
  }

  function render() {
    $('main').innerHTML = head() + viewBody() + `<div class="foot"><span>AlgoDesk · MT5 Agent ${esc(tel()?.agent_version || '–')}</span></div>`;
    $('crumb').textContent = HEADS[S.view][3];
    document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.view === S.view));
    const t = tel(), online = S.st?.agent?.online;
    $('navPos').textContent = t?.positions?.length ?? 0;
    $('navSym').textContent = t?.symbols?.length ?? 0;
    const ap = $('acctPill');
    ap.className = 'pill ' + (t ? (t.account.demo ? 'demo' : 'real') : '');
    ap.innerHTML = `<span class="dot"></span>${t ? (t.account.demo ? 'Demo' : 'Akun real') : 'Tanpa data'}`;
    const mp = $('mt5Pill');
    mp.className = 'pill ' + (online && t?.terminal_connected ? '' : 'bad');
    mp.innerHTML = `${icon('i-radio')}${online && t?.terminal_connected ? 'MT5 terhubung' : 'MT5 terputus'}`;
    $('vpsState').innerHTML = `<span class="dot ${online ? 'g' : 'r'}"></span>${online ? 'Gateway aktif' : 'Agent offline'}`;
  }
  function safeRender() {
    // keep half-typed form values: skip auto-refresh while the user is in a field
    if (document.activeElement?.matches('#main input, #main select')) return;
    render();
  }

  // ---------- polling ----------
  async function loadState() {
    const st = await api('/state');
    (st.telemetry?.symbols || []).forEach(s => { const prev = S.prevBid[s.symbol]; S.dir[s.symbol] = prev == null ? 0 : Math.sign(s.bid - prev); S.prevBid[s.symbol] = s.bid; });
    const switched = S.st && st.telemetry && S.st.telemetry?.account?.login !== st.telemetry.account.login;
    S.st = st; S.fetchedAt = Date.now();
    if (switched) await loadEquity();  // another account logged in: drop the old account's chart now
  }
  const loadEquity = async () => { S.eq = (await api('/equity?hours=' + S.eqHours)).samples; };
  const loadCmds = async () => { S.cmds = (await api('/commands?limit=100')).commands; };
  const loadUsers = async () => { if (can('admin')) S.users = (await api('/users')).users; };

  function every(ms, fn) { const run = () => fn().catch(e => console.warn(e)); run(); S.timers.push(setInterval(run, ms)); }
  function startPolling() {
    S.timers.forEach(clearInterval); S.timers = [];
    every(2000, async () => { await loadState(); safeRender(); });
    every(30000, async () => { await loadEquity(); safeRender(); });
    every(5000, async () => { if (S.view === 'settings') { await loadCmds(); safeRender(); } });
    S.timers.push(setInterval(() => {
      const c = $('clock'); if (c) c.textContent = new Date().toLocaleTimeString('id-ID');
      const a = $('telAgo'), g = ago(); if (a && g != null) a.textContent = Math.round(g) + ' detik lalu';
    }, 1000));
  }

  async function sendCommand(body, label) {
    if (S.pending) return;
    try {
      const { id } = await api('/commands', { method: 'POST', body });
      S.pending = { id, label }; render();
      const started = Date.now();
      while (Date.now() - started < 130000) {
        await new Promise(r => setTimeout(r, 1000));
        const c = await api('/commands/' + id);
        if (c.status === 'pending') continue;
        S.pending = null;
        if (c.status === 'acked') toast(`${label}: ${c.result || 'dikonfirmasi agent'}`);
        else if (c.status === 'failed') toast(`${label} ditolak agent: ${c.result}`, 'err');
        else toast(`${label} kedaluwarsa: agent tidak merespons.`, 'err');
        await loadState(); render(); return;
      }
      S.pending = null; render();
    } catch (e) { S.pending = null; toast(e.message, 'err'); render(); }
  }

  // ---------- login ----------
  function showLogin() {
    S.timers.forEach(clearInterval); S.timers = []; S.me = null;
    $('appView').hidden = true; $('loginView').hidden = false; $('lu').focus();
  }
  async function showApp(me) {
    S.me = me;
    $('loginView').hidden = true; $('appView').hidden = false;
    $('uname').textContent = me.display_name; $('urole').textContent = 'Peran: ' + ROLE_LABEL[me.role];
    $('avatar').textContent = me.display_name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    $('navUsers').hidden = me.role !== 'admin';
    S.view = 'overview'; render(); startPolling();
  }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('loginErr').textContent = '';
    try { showApp(await api('/auth/login', { method: 'POST', body: { username: $('lu').value, password: $('lp').value } })); $('lp').value = ''; }
    catch (err) { $('loginErr').textContent = err.message; }
  });

  // ---------- events ----------
  document.addEventListener('click', async e => {
    const nav = e.target.closest('[data-view],[data-go]');
    if (nav) {
      S.view = nav.dataset.view || nav.dataset.go; S.confirm = false; window.scrollTo(0, 0);
      S.eqHours = S.view === 'perf' ? 168 : 24;
      try { if (S.view === 'perf' || S.view === 'overview') await loadEquity(); if (S.view === 'settings') await loadCmds(); if (S.view === 'users') await loadUsers(); } catch (err) { toast(err.message, 'err'); }
      render(); return;
    }
    const ub = e.target.closest('#userBtn'), menu = $('userMenu');
    if (ub) { menu.hidden = !menu.hidden; ub.setAttribute('aria-expanded', String(!menu.hidden)); return; }
    if (!e.target.closest('.user')) menu.hidden = true;
    const mg = e.target.closest('[data-magic]');
    if (mg && !mg.disabled) { const m = +mg.dataset.magic, on = mg.classList.contains('on'); sendCommand({ type: on ? 'disable_magic' : 'enable_magic', magic: m }, `${on ? 'Nonaktifkan' : 'Aktifkan'} magic ${m}`); return; }
    const ua = e.target.closest('[data-uactive]');
    if (ua && !ua.disabled) { try { await api('/users/' + ua.dataset.uactive, { method: 'PATCH', body: { active: !ua.classList.contains('on') } }); await loadUsers(); toast('Status pengguna diperbarui.'); } catch (err) { toast(err.message, 'err'); } render(); return; }
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    if (act === 'logout') { try { await api('/auth/logout', { method: 'POST', body: {} }); } catch (_) {} showLogin(); }
    if (act === 'pause') { S.confirm = true; render(); }
    if (act === 'cancel') { S.confirm = false; render(); }
    if (act === 'send') { S.confirm = false; const paused = tel()?.protection?.entry_state === 'paused'; sendCommand({ type: paused ? 'resume_entry' : 'pause_entry' }, paused ? 'Lanjutkan entry' : 'Jeda entry'); }
  });
  document.addEventListener('change', async e => {
    const r = e.target.closest('[data-urole]');
    if (e.target.id === 'curSel') { S.cur = e.target.value; pref.set('cur', S.cur); e.target.blur(); render(); return; }
    if (r) { try { await api('/users/' + r.dataset.urole, { method: 'PATCH', body: { role: r.value } }); await loadUsers(); toast('Peran diperbarui. Pengguna perlu login ulang.'); } catch (err) { toast(err.message, 'err'); } r.blur(); render(); }
  });
  document.addEventListener('submit', async e => {
    const f = e.target; if (f.id === 'loginForm') return;
    e.preventDefault();
    try {
      if (f.id === 'fxForm') { const v = parseFloat($('fxIn').value); if (!(v >= 1000)) throw new Error('Kurs tidak valid'); pref.set('usdIdr', String(v)); $('fxIn').blur(); toast('Kurs disimpan'); render(); return; }
      if (f.id === 'limitForm') { const v = parseFloat($('limIn').value); $('limIn').blur(); await sendCommand({ type: 'set_limit', value: v }, `Ubah batas rugi ke ${v}%`); await loadCmds(); }
      else if (f.id === 'eaAdd') { await api('/eas/' + $('eaAddMagic').value, { method: 'PUT', body: { name: $('eaAddName').value, scope: '' } }); toast('EA didaftarkan.'); }
      else if (f.dataset.eaform) { const m = f.dataset.eaform; await api('/eas/' + m, { method: 'PUT', body: { name: $('ean-' + m).value, scope: $('eas-' + m).value } }); toast('Nama EA disimpan.'); }
      else if (f.id === 'userAdd') { await api('/users', { method: 'POST', body: { username: $('nu-user').value, display_name: $('nu-name').value, role: $('nu-role').value, password: $('nu-pw').value } }); await loadUsers(); toast('Pengguna ditambahkan.'); }
      else if (f.dataset.upw) { await api('/users/' + f.dataset.upw, { method: 'PATCH', body: { password: $('upw-' + f.dataset.upw).value } }); toast('Kata sandi diperbarui. Sesi pengguna itu diakhiri.'); }
      document.activeElement?.blur(); await loadState(); render();
    } catch (err) { toast(err.message, 'err'); }
  });

  api('/auth/me').then(showApp).catch(showLogin);
})();
</script>
</body>
</html>

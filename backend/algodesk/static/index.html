<!doctype html>
<html lang="id">
<head>
<script>try { const t = localStorage.getItem('algodesk.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlgoDesk MT5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Navy trading-journal look: top account bar, sidebar, dense panels (from the user's reference screens) */
:root {
  color-scheme: dark;
  --bg: #08111f;
  --panel: #0d1a2e;
  --panel-2: #11223b;
  --panel-3: #16294a;
  --line: #1c3253;
  --line-soft: #162a47;
  --fg: #e9eef7;
  --fg-2: #aab8cc;
  --muted: #6f829e;
  --accent: #2f7cf6;
  --accent-2: #1f5fd0;
  --accent-bg: #12305e;
  --up: #22c55e;
  --up-bg: #0f3424;
  --down: #f04452;
  --down-bg: #3c1520;
  --warn: #f5a524;
  --warn-bg: #3a2a10;
  --cyan: #22b8f0;
  --purple: #8b6cf6;
  --gold: #e8a33c;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef2f8; --panel: #ffffff; --panel-2: #f3f6fb; --panel-3: #e8eef8; --line: #d9e1ee; --line-soft: #e6ecf5;
    --fg: #0f1b2d; --fg-2: #3c4b62; --muted: #6a7a92;
    --accent: #1f6ae6; --accent-2: #1756c0; --accent-bg: #dce8fd;
    --up: #128a4a; --up-bg: #dcf3e6; --down: #d12c3c; --down-bg: #fbe2e5; --warn: #b26b00; --warn-bg: #fbeed5;
    --cyan: #0b84b8; --purple: #6a48d8; --gold: #b7791f;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef2f8; --panel: #ffffff; --panel-2: #f3f6fb; --panel-3: #e8eef8; --line: #d9e1ee; --line-soft: #e6ecf5;
  --fg: #0f1b2d; --fg-2: #3c4b62; --muted: #6a7a92;
  --accent: #1f6ae6; --accent-2: #1756c0; --accent-bg: #dce8fd;
  --up: #128a4a; --up-bg: #dcf3e6; --down: #d12c3c; --down-bg: #fbe2e5; --warn: #b26b00; --warn-bg: #fbeed5;
  --cyan: #0b84b8; --purple: #6a48d8; --gold: #b7791f;
}
* { box-sizing: border-box; }
svg { width: 16px; height: 16px; flex: none; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13.5px; line-height: 1.45; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.g { color: var(--up); } .dot.r { color: var(--down); } .dot.y { color: var(--warn); } .dot.b { color: var(--accent); } .dot.m { color: var(--muted); }

/* ---------- top account bar ---------- */
.top { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 72px; }
.top > div { display: flex; align-items: center; padding: 10px 20px; border-right: 1px solid var(--line); min-width: 0; }
.tb-brand { gap: 14px; width: 340px; flex: none; }
.tb-brand .logo { display: flex; gap: 3px; align-items: flex-end; height: 30px; }
.tb-brand .logo i { width: 7px; border-radius: 2px; background: var(--accent); }
.tb-brand b { display: block; font-size: 16.5px; letter-spacing: .04em; font-weight: 700; }
.tb-brand small { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 260px; }
.tb-conn { flex-direction: column; align-items: flex-start !important; justify-content: center; gap: 1px; font-size: 12px; color: var(--fg-2); flex: none; }
.tb-conn b { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.tb-acct { flex: 1; gap: 8px 20px; flex-wrap: wrap; }
.tb-acct select { padding: 2px 6px; font-size: 12px; margin-top: 2px; display: block; }
.tb-acct .m small { display: block; color: var(--fg-2); font-size: 11.5px; }
.tb-acct .m b { font-family: var(--mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
.tb-acct .ttl { font-weight: 600; font-size: 12.5px; }
.tb-time { flex-direction: column; align-items: flex-start !important; justify-content: center; font-size: 13px; flex: none; gap: 2px; }
.tb-time select { margin-top: 2px; }
.tb-theme { flex: none; border-right: 0 !important; padding-right: 4px !important; }
.tswitch { position: relative; width: 60px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel-3); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--fg-2); }
.tswitch svg { width: 14px; height: 14px; position: relative; z-index: 1; }
.tswitch .knob { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); transition: transform .2s; }
.tswitch[aria-checked="true"] .knob { transform: translateX(30px); }
.tswitch[aria-checked="false"] .i-moon, .tswitch[aria-checked="true"] .i-sun { color: #fff; }
.tswitch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.user { position: relative; border-right: 0 !important; flex: none; }
.user > button { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; text-align: left; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-bg); color: var(--fg); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.user small { display: block; color: var(--muted); font-size: 12px; }
.menu { position: absolute; right: 12px; top: calc(100% - 4px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; min-width: 220px; z-index: 30; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
.menu button { display: flex; width: 100%; justify-content: space-between; background: none; border: 0; padding: 9px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--panel-2); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 73px); }
.side { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--fg-2); background: none; border: 0; cursor: pointer; text-align: left; width: 100%; font-size: 14px; }
.nav:hover { background: var(--panel-2); color: var(--fg); }
.nav.on { background: var(--accent); color: #fff; }
.nav svg { width: 19px; height: 19px; }
.nav .ct { margin-left: auto; min-width: 22px; height: 22px; border-radius: 11px; background: var(--panel-3); color: var(--fg); font-size: 12px; display: grid; place-items: center; padding: 0 6px; }
.nav.on .ct { background: rgba(255,255,255,.2); }
.navgroup { display: flex; flex-direction: column; gap: 3px; }
.symbox { margin-top: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.symbox h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.symrow { display: grid; grid-template-columns: 30px 1fr 64px; gap: 10px; align-items: center; }
.coin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #1a1205; background: var(--gold); }
.symrow b { display: block; font-size: 13px; }
.symrow .num { font-size: 14px; display: block; }
.symrow svg { width: 64px; height: 30px; }
.ver { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 10px 4px 0; }

main { padding: 18px 20px 24px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.phead h1 { font-size: 24px; margin: 0 0 2px; font-weight: 700; letter-spacing: -.01em; }
.phead p { margin: 0; color: var(--fg-2); }
.phead .acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- generic panels ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
.ph h2 { font-size: 15.5px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.ph p { margin: 2px 0 0; color: var(--fg-2); font-size: 12.5px; }
.ph .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g-ov1 { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1.1fr) minmax(0, .75fr); }
.g-ov2 { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.g-ea2 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; cursor: pointer; color: var(--fg); white-space: nowrap; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.green { background: var(--up); border-color: var(--up); color: #04220f; font-weight: 600; }
.btn.red { background: var(--down); border-color: var(--down); color: #fff; font-weight: 600; }
.btn.outline { background: none; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.icon { padding: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 13px; cursor: pointer; color: var(--fg-2); font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.fxchip { background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.fxbig { font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1.1; }
.fxstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; padding: 0 16px 14px; }
.fxstats small { display: block; color: var(--fg-2); font-size: 12px; }
.fxcard { display: flex; flex-direction: column; }
.fxchart { flex: 1; min-height: 160px; padding: 0 16px 16px; }
.fxchart svg { width: 100%; height: 100%; display: block; }
.seg.scroll { max-width: 100%; overflow-x: auto; }
.seg.scroll button { flex: none; }
.seg button.on { background: var(--accent-bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
select, input { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chip.g { background: var(--up-bg); color: var(--up); border-color: transparent; }
.chip.r { background: var(--down-bg); color: var(--down); border-color: transparent; }
.chip.y { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.b { background: var(--accent-bg); color: var(--cyan); border-color: transparent; }
.chip.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--fg-2); font-weight: 500; padding: 9px 12px; background: var(--panel-2); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.c, th.c { text-align: center; }
.side-b { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.side-b.buy { background: var(--up-bg); color: var(--up); } .side-b.sell { background: var(--down-bg); color: var(--down); }
.bkt { font-family: var(--mono); font-size: 12px; color: var(--cyan); background: var(--accent-bg); padding: 2px 7px; border-radius: 4px; }

/* filter bar */
.fbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; }
.fbar .f { display: flex; flex-direction: row; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 0 0 0 10px; background: var(--panel); }
.fbar .f span { color: var(--fg-2); font-size: 12.5px; }
.fbar .f select { border: 0; border-left: 1px solid var(--line); border-radius: 0 8px 8px 0; background: var(--panel-2); min-width: 120px; }
.fbar .range { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; color: var(--fg-2); }
.fbar .live { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--fg-2); font-size: 12.5px; }
.fbar .live b { color: var(--up); font-weight: 500; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; min-height: 112px; position: relative; }
.kpi .lbl { grid-column: 1 / -1; color: var(--fg-2); font-size: 13px; display: flex; justify-content: space-between; }
.kpi .val { font-family: var(--mono); font-size: 26px; font-weight: 600; white-space: nowrap; line-height: 1.15; }
.kpi .val small { font-size: 15px; margin-left: 4px; }
.kpi .sub { grid-column: 1 / -1; color: var(--fg-2); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
.kpi .sub b { display: block; font-family: var(--mono); color: var(--fg); font-weight: 500; font-size: 13px; }
.kpi .vis { grid-row: 2 / 4; grid-column: 2; align-self: center; }
.kpi .vis svg { width: 70px; height: 40px; }
.ring { width: 64px; height: 64px; }
.ring svg { width: 64px; height: 64px; }

/* charts */
.chart { position: relative; padding: 4px 16px 12px 56px; }
.chart svg.plot { width: 100%; height: 190px; display: block; overflow: visible; }
.yl { position: absolute; left: 6px; width: 46px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); transform: translateY(-50%); }
.xl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
.legend { display: flex; justify-content: center; gap: 18px; color: var(--fg-2); font-size: 12px; margin-top: 6px; }
.legend span { display: flex; gap: 6px; align-items: center; }
.legend i { width: 14px; border-top: 2px solid var(--up); }
.legend i.dash { border-top: 2px dashed var(--accent); }
.symperf { display: flex; flex-direction: column; }
.symperf .it { display: grid; grid-template-columns: 38px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.symperf .coin { width: 38px; height: 38px; font-size: 14px; }
.symperf b { font-size: 14px; }
.symperf .r { text-align: right; }
.symperf svg { width: 90px; height: 34px; }

/* basket & risk */
.basket { border: 1px solid var(--line); border-radius: 8px; margin: 0 12px 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.basket .bh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.basket .bh b { font-family: var(--mono); }
.basket .bh .muted { font-size: 12.5px; }
.basket .bh .op { margin-left: auto; color: var(--fg-2); font-size: 12.5px; }
.ring-o { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--up); }
.bgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 10px; }
.bgrid small { color: var(--fg-2); font-size: 11.5px; display: block; }
.bgrid b { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.bar { height: 7px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--up)); }
.bar.warn i { background: var(--warn); } .bar.crit i { background: var(--down); }
.bfoot { display: flex; gap: 14px; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-2); }
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; padding: 12px 16px; }
.rgrid small, .rmini small { color: var(--fg-2); font-size: 12px; display: block; }
.rgrid b, .rmini b { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.rmini { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line-soft); }
.rmini > div { padding: 10px 12px; border-right: 1px solid var(--line-soft); }
.rmini > div:last-child { border-right: 0; }
.rmini b { font-size: 14px; }

/* EA cards */
.eacards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.eac { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.eac .h { display: flex; justify-content: space-between; gap: 10px; }
.eac .h b { font-size: 15.5px; display: block; }
.eac .h small { color: var(--fg-2); font-size: 12.5px; }
.eac .st { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.srcard .ph h2 .chip { margin-left: 6px; vertical-align: middle; }
.srbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; padding: 4px 16px 16px; }
.srstate { display: flex; flex-direction: column; gap: 6px; }
.srstate small { color: var(--fg-2); }
.srstate b { font-family: var(--mono); font-size: 13.5px; }
.srform { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: end; }
.srbtns { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
@media (max-width: 900px) { .srbody { grid-template-columns: minmax(0, 1fr); } }
.sw { position: relative; width: 74px; height: 30px; border-radius: 15px; border: 0; cursor: pointer; background: var(--panel-3); color: var(--fg-2); font-size: 12px; font-weight: 600; text-align: right; padding: 0 12px; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw.on { background: var(--up); color: #fff; text-align: left; }
.sw.on::after { left: 48px; }
.sw[disabled] { opacity: .5; cursor: not-allowed; }
.run { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; border: 1px solid currentColor; }
.run.g { color: var(--up); } .run.r { color: var(--down); } .run.y { color: var(--warn); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; color: var(--fg-2); }
.kv b { color: var(--fg); font-family: var(--mono); font-weight: 500; text-align: right; }
.estat { display: grid; grid-template-columns: 1.35fr .9fr 1fr 1fr; border-top: 1px solid var(--line-soft); padding-top: 10px; }
.estat > div { padding: 0 6px; border-left: 1px solid var(--line-soft); min-width: 0; }
.estat > div:first-child { padding-left: 0; border-left: 0; }
.estat small { color: var(--fg-2); font-size: 11px; display: block; line-height: 1.25; min-height: 28px; }
.estat b { font-family: var(--mono); font-size: 16px; font-weight: 600; white-space: nowrap; }
.estat em { font-style: normal; font-family: var(--mono); font-size: 12px; display: block; }
.eac .spk svg { width: 100%; height: 44px; display: block; }
.eac .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.eac form { display: flex; flex-direction: column; gap: 8px; }
.donut { display: flex; gap: 22px; align-items: center; padding: 8px 18px 18px; flex-wrap: wrap; }
.donut svg { width: 150px; height: 150px; }
.donut ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 160px; }
.donut li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 12px; align-items: center; }
.ev { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.ev.INFO { background: var(--accent-bg); color: var(--cyan); } .ev.TRADE { background: var(--up-bg); color: var(--up); }
.ev.WARN { background: var(--warn-bg); color: var(--warn); } .ev.ERROR { background: var(--down-bg); color: var(--down); }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 4px 16px 12px; }
.res small { color: var(--fg-2); font-size: 12px; display: block; }
.res b { font-family: var(--mono); font-size: 16px; display: block; margin-bottom: 6px; }

/* protection (risk center page) */
.prot { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.state { display: flex; align-items: center; gap: 8px; }
.prow { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-2); gap: 8px; }
.confirm { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.confirm div { display: flex; gap: 8px; justify-content: flex-end; }
.center { text-align: center; color: var(--muted); font-size: 12.5px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; padding: 4px 16px 16px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--panel-3); border: 0; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: left .2s; }
.toggle.on { background: var(--up); } .toggle.on::after { left: 19px; background: #fff; }
.toggle[disabled] { opacity: .45; cursor: not-allowed; }
.pf { padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--fg-2); font-size: 12.5px; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--fg-2); }
.li span:last-child { margin-left: auto; color: var(--fg); }
.foot { color: var(--muted); font-size: 12px; }

/* modal & toasts */
.modal { position: fixed; inset: 0; background: rgba(3,8,16,.66); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .card { width: min(980px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.modal .tw { overflow: auto; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100% - 32px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--up); border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 24px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.err { border-left-color: var(--down); }
@keyframes tin { from { transform: translateY(8px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.login { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.login form { width: min(380px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.login h1 { font-size: 22px; margin: 0; }
.login .err { color: var(--down); font-size: 13px; min-height: 18px; }

tfoot td { border-top: 1px solid var(--line); background: var(--panel-2); }
/* trading sessions */
.g-sess1 { grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr); }
.al-start { align-items: start; }
.clkrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.clk { padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; border-width: 1.5px; }
.clk > small:first-child { color: var(--fg); font-size: 14px; }
.clk b { font-size: 26px; font-weight: 600; letter-spacing: .5px; }
.clk small { color: var(--fg-2); font-size: 12.5px; }
.clk > span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.clk > span svg { width: 14px; height: 14px; }
.clk.on { border-color: var(--up); background: color-mix(in srgb, var(--up) 7%, var(--panel)); }
.clk.off { border-color: var(--down); background: color-mix(in srgb, var(--down) 7%, var(--panel)); }
.srows { display: flex; flex-direction: column; padding: 0 16px 10px; }
.srows > div { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.srows > div:last-child { border-bottom: 0; }
.srows > div > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.srows b { font-weight: 500; }
.srows.tight { padding: 4px 0 0; }
.srows.tight > div { grid-template-columns: minmax(0, 1fr) auto auto; }
.tl { --lw: 104px; padding: 4px 16px 14px; }
.tl .axis { position: relative; height: 18px; margin-left: var(--lw); font-size: 11px; color: var(--muted); }
.tl .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl .axis span:first-child { transform: none; } .tl .axis span:last-child { transform: translateX(-100%); }
.tl .lanes { position: relative; }
.tl .lane { display: flex; align-items: center; height: 30px; }
.tl .lane > span { width: var(--lw); flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-2); }
.tl .track { position: relative; flex: 1; height: 22px; background: var(--panel-2); border-radius: 4px; }
.tl .track i { position: absolute; top: 0; bottom: 0; border-radius: 4px; color: #fff; font-style: normal; font-size: 11px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; opacity: .9; }
.tl .now { position: absolute; top: -4px; bottom: -4px; left: calc(var(--lw) + (100% - var(--lw)) * var(--p)); border-left: 2px dashed var(--fg); }
.legend { display: flex; gap: 14px; padding: 0 16px; font-size: 12.5px; color: var(--fg-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.sbars { width: 100%; height: auto; display: block; padding: 6px 12px 10px; }
.sbars text { fill: var(--fg-2); font-size: 12px; }
.sbars .gl { stroke: var(--line-soft); } .sbars .zero { stroke: var(--muted); }
.donut { display: flex; align-items: center; gap: 22px; padding: 6px 16px 16px; flex-wrap: wrap; }
.donut svg { width: 170px; height: 170px; flex: none; }
.donut text { fill: var(--fg-2); font-size: 12px; } .donut text.big { fill: var(--fg); font-size: 24px; font-weight: 600; }
.donut .dl { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 180px; font-size: 13px; }
.donut .dl div { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; }
.sbody { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 16px; }
.sbody .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.sfilter { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.sfilter span { display: flex; flex-direction: column; gap: 2px; }
.sw.sm { width: 46px; height: 24px; padding: 0; }
.sw.sm::after { top: 3px; left: 3px; width: 18px; height: 18px; }
.sw.sm.on::after { left: 25px; }
.sform { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.sform label span { display: flex; gap: 6px; align-items: center; }
.sform input { flex: 1; min-width: 0; }
.phead .acts select { min-width: 130px; }

@media (max-width: 1500px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-ov1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .g-ov1 > :last-child { grid-column: 1 / -1; }
  .tb-brand { width: auto; }
}
@media (max-width: 1180px) {
  .g-ov1, .g-ov2, .g-ea2, .g-2, .g-sess1 { grid-template-columns: minmax(0, 1fr); }
  .top { flex-wrap: wrap; }
  .top > div { border-bottom: 1px solid var(--line); }
  .tb-acct { order: 5; flex-basis: 100%; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; padding: 8px 16px; }
  .navgroup { flex-direction: row; }
  .nav { width: auto; white-space: nowrap; padding: 8px 12px; }
  .symbox, .ver { display: none; }
  main { padding: 14px 16px 20px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rmini { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .clkrow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .clk b { font-size: 21px; }
  .tl { --lw: 76px; }
  .tl .axis span:not(:nth-child(3n+1)) { display: none; }
  .top > div { padding: 10px 16px; }
  .tb-brand small { max-width: 200px; }
  .fbar .live { margin-left: 0; }
}
@media (max-width: 520px) {
  .kpi { min-height: 0; padding: 12px; }
  .kpi .val { font-size: 20px; }
  .kpi .vis { display: none; }
  .top .tb-time { display: none; }
  .tb-brand { flex: 1; }
  .top .tb-conn, .user small, .user b { display: none; }
  .tb-brand b { font-size: 14px; }
  .tb-acct { gap: 14px; }
  .estat b { font-size: 14px; }
}

    <div class="menu" id="userMenu" hidden><button data-act="logout">Keluar <span class="muted">akhiri sesi</span></button></div>
  </div>
</header>

  <aside class="side">

      <button class="nav on" data-view="overview"><svg><use href="#i-home"/></svg>Overview</button>

<script>
(() => {
  const ROLE_LABEL = { admin: 'Super Admin', trader: 'Trader', viewer: 'Viewer' };
  const CMD_LABEL = { pause_entry: 'Jeda entry', resume_entry: 'Lanjutkan entry', disable_magic: 'Nonaktifkan EA', enable_magic: 'Aktifkan EA', set_limit: 'Ubah batas rugi',
    risk_set: 'Ubah proteksi rugi', risk_reset: 'Buka blokir', session_set: 'Ubah filter sesi', sr_set: 'Ubah StopReverse', sr_close: 'Tutup StopReverse' };
  const STATUS_LABEL = { pending: 'Menunggu agent', acked: 'Dikonfirmasi agent', failed: 'Ditolak agent', expired: 'Kedaluwarsa' };
  const PERIODS = { 1: 'Hari ini', 7: '7 Hari', 30: '30 Hari' };
  const S = {
    me: null, st: null, fetchedAt: 0, eq: [], cmds: [], users: [], view: 'overview', confirm: false, pending: null,
    hist: {}, timers: [], lastUpdate: null,
    days: 7, sym: 'ALL', eqTab: 'equity', dpTab: 'pl', trades: [], tradesStart: null,
    statsDay: [], perfTab: 'day', statsPer: [], perStart: null, deals: [], dealsStart: null,
    logEa: '', logSym: '', logEv: '', histSym: 'ALL', histQ: '', histDays: 7, histTrades: [], basketSym: 'ALL',
    edit: null, detail: null, detailTrades: [],
    tickAt: {}, sessDays: 7, sessSym: 'ALL', sessTrades: [], sessStart: null, sessStamp: 0, sessEdit: false, sessDist: 'count',
  };

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = id => `<svg><use href="#${id}"/></svg>`;
  const tel = () => S.st?.telemetry;
  const can = what => ({ control: ['admin', 'trader'], admin: ['admin'] }[what] || []).includes(S.me?.role);
  const ago = () => S.st?.agent?.age == null ? null : S.st.agent.age + (Date.now() - S.fetchedAt) / 1000;
  const sum = (xs, f = x => x) => xs.reduce((a, x) => a + f(x), 0);

  // Deal and day-start times are broker server time encoded as epoch seconds, so they are shown as UTC.
  // Command times are real epoch; shifting them by the server's offset puts them on the same clock.
  const srvOffset = () => { const t = tel(); return t?.server_time && t?.sent_at ? Math.round((t.server_time - t.sent_at) / 900) * 900 : 0; };
  const fmtSrv = (ts, o = {}) => ts == null ? '–' : new Date(ts * 1000).toLocaleString('id-ID', { timeZone: 'UTC', ...o });
  const srvHms = ts => fmtSrv(ts, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const srvDay = ts => fmtSrv(ts, { day: '2-digit', month: 'short' });
  const srvDayTime = ts => fmtSrv(ts, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const dur = s => { s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}h ${h}j` : h ? `${h}j ${m}m` : `${m}m`; };

  // ---------- currency ----------
  // Amounts arrive in the account currency (USD, USC/USDc cent accounts, IDR) and are shown in the
  // currency the viewer picks. USD/IDR comes from the broker's USDIDR symbol when it has one (live),
  // else from the server's free exchange-rate API (daily), else from a rate the viewer enters in
  // Settings. The picked currency and the manual rate stay in this browser only.
  const pref = { get: k => { try { return localStorage.getItem('algodesk.' + k); } catch { return null; } },
                 set: (k, v) => { try { localStorage.setItem('algodesk.' + k, v); } catch {} } };
  // ---------- theme ----------
  // Light or dark, as the viewer picks with the switch in the top bar; until then the system setting.
  const theme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const showTheme = () => { const b = $('themeBtn'); if (b) b.setAttribute('aria-checked', String(theme() === 'light')); };
  showTheme();
  S.sessTz = pref.get('sessTz');
  const CURS = ['USD', 'USC', 'IDR'];
  S.cur = pref.get('cur');
  const normCur = c => { c = String(c || 'USD').toUpperCase(); return c.startsWith('USC') || c === 'USDC' ? 'USC' : c; };
  const brokerIdr = () => tel()?.fx?.usd_idr || 0;
  const manualIdr = () => parseFloat(pref.get('usdIdr')) || 0;
  const apiIdr = () => S.fx?.usd_idr || 0;
  const idrRate = () => brokerIdr() || apiIdr() || manualIdr();
  const idrSource = () => brokerIdr() ? 'simbol USDIDR broker (live)' : apiIdr() ? `API kurs ${S.fx.source}` : manualIdr() ? 'kurs manual' : '';
  const usdPer = c => c === 'USD' ? 1 : c === 'USC' ? 0.01 : c === 'IDR' && idrRate() ? 1 / idrRate() : null;
  const acctCur = () => normCur(tel()?.account?.currency);
  const viewCur = () => { const c = S.cur || acctCur(); return usdPer(c) && usdPer(acctCur()) ? c : acctCur(); };
  const conv = v => { const from = usdPer(acctCur()), to = usdPer(viewCur()); return from && to ? v * from / to : v; };
  const fmtNum = (v, sign) => {
    if (v == null || Number.isNaN(v)) return '–';
    const cur = viewCur(), x = conv(v), dec = cur === 'IDR' ? 0 : 2;
    return (x < 0 ? '−' : sign && x > 0 ? '+' : '') + Math.abs(x).toLocaleString(cur === 'IDR' ? 'id-ID' : 'en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  };
  // An account-currency amount in a given currency (USD, USC or IDR), for the multi-currency P/L columns.
  const fmtIn = (v, cur, sign) => {
    const from = usdPer(acctCur()), to = usdPer(cur);
    if (v == null || Number.isNaN(v) || !from || !to) return '–';
    const x = v * from / to, dec = cur === 'IDR' ? 0 : 2;
    return (x < 0 ? '−' : sign && x > 0 ? '+' : '') + Math.abs(x).toLocaleString(cur === 'IDR' ? 'id-ID' : 'en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  };
  const PL_CURS = ['USC', 'USD', 'IDR'];
  const plCells = (v, bold) => PL_CURS.map(c => `<td class="r num ${cls(v)}">${bold ? '<b>' : ''}${fmtIn(v, c, true)}${bold ? '</b>' : ''}</td>`).join('');
  // floating P/L as a percentage of the account balance
  const balPct = v => { const b = tel()?.account?.balance; return b ? v / b * 100 : null; };
  const fmtMoney = (v, sign) => {
    if (v == null || Number.isNaN(v)) return '–';
    const cur = viewCur(), n = fmtNum(v, sign), s = /^[−+]/.test(n) ? n[0] : '', body = s ? n.slice(1) : n;
    return s + (cur === 'USD' ? '$' + body : cur === 'IDR' ? 'Rp ' + body : body + ' ' + cur);
  };
  // step = distance between axis ticks; enough decimals are shown that neighbouring ticks differ.
  const fmtAxis = (v, step = 0) => {
    const cur = viewCur(), x = conv(v), a = Math.abs(x);
    const [u, sfx, dflt] = cur === 'IDR' ? (a >= 1e9 ? [1e9, 'M', 2] : [1e6, 'jt', 1])
      : a >= 1e6 ? [1e6, 'M', 2] : a >= 1e4 ? [1e3, 'k', 1] : [1, '', 0];
    const s = Math.abs(conv(step)) / u, dec = s > 0 ? Math.min(4, Math.max(dflt, Math.ceil(-Math.log10(s) - 1e-9))) : dflt;
    return (x / u).toFixed(dec) + sfx;
  };
  const fmtPx = (v, d = 2) => v == null ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, sign = true) => v == null || !isFinite(v) ? '–' : (v < 0 ? '−' : sign && v > 0 ? '+' : '') + Math.abs(v).toFixed(2) + '%';
  const cls = v => v < 0 ? 'down' : v > 0 ? 'up' : '';
  const symDigits = sym => tel()?.symbols?.find(s => s.symbol === sym)?.digits ?? (tel()?.positions?.find(p => p.symbol === sym)?.digits) ?? 2;

  async function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
    const r = await fetch('/api' + path, init);
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== '/auth/login') { showLogin(); throw new Error(j.detail || 'Sesi berakhir'); }
    if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Permintaan gagal (HTTP ' + r.status + ')');
    return j;
  }
  function toast(msg, kind = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind; el.textContent = msg;
    $('toasts').appendChild(el); setTimeout(() => el.remove(), 4500);
  }

  // ---------- small charts ----------
  function spark(vals, color = 'var(--up)', w = 100, h = 34, fill = true) {
    if (!vals || vals.length < 2) return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${h - 2}" y2="${h - 2}" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".7"/></svg>`;
    const lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
    const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 2 - (v - lo) / sp * (h - 4)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    const id = 'sg' + Math.random().toString(36).slice(2, 8);
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${fill ? `<path d="${d}L${w},${h}L0,${h}Z" fill="url(#${id})"/>` : ''}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function ring(p, color = 'var(--up)') {
    const r = 26, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, p / 100));
    return `<div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="7"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/></svg></div>`;
  }
  const niceTicks = (min, max, n = 4) => {
    const span = Math.max(max - min, 1e-9), raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
    for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
    return { lo, hi, t };
  };

  // ---------- derived data ----------
  const SYM_COLORS = ['var(--accent)', 'var(--gold)', 'var(--up)', 'var(--purple)', 'var(--cyan)', 'var(--down)'];
  const coinHtml = (sym, big) => { const s = String(sym || '?'); const b = s.startsWith('BTC') ? '₿' : s.startsWith('XAU') ? 'Au' : s.slice(0, 2);
    const col = s.startsWith('BTC') ? '#f7931a' : s.startsWith('XAU') ? 'var(--gold)' : s.startsWith('EUR') ? '#4c8df6' : s.startsWith('GBP') ? '#a78bfa' : s.startsWith('USD') ? '#22c55e' : '#7dd3fc';
    return `<span class="coin" style="background:${col}${big ? ';width:38px;height:38px' : ''}">${esc(b)}</span>`; };
  const regName = m => S.st?.eas.find(e => e.magic === m)?.name;
  const regScope = m => S.st?.eas.find(e => e.magic === m)?.scope || '';
  const eaLabel = m => m ? (regName(m) || 'EA ' + m) : 'Manual';
  const basketId = (m, sym) => 'BKT-' + (m || 0);
  function eaMagics() {
    const set = new Set();
    (S.st?.eas || []).forEach(e => set.add(e.magic));
    (tel()?.positions || []).forEach(p => p.magic && set.add(p.magic));
    (tel()?.protection?.disabled_magics || []).forEach(m => set.add(m));
    [...S.statsDay, ...S.statsPer].forEach(e => e.magic && set.add(e.magic));
    return [...set].sort((a, b) => a - b);
  }
  const eaSymbol = m => {
    const st = S.statsPer.find(e => e.magic === m) || S.statsDay.find(e => e.magic === m);
    return Object.keys(st?.symbols || {})[0] || (tel()?.positions || []).find(p => p.magic === m)?.symbol || regScope(m).split(/[·,]/)[0].trim() || '–';
  };
  const eaOff = m => (tel()?.protection?.disabled_magics || []).includes(m);
  function eaRun(m) {
    const p = tel()?.protection, online = S.st?.agent?.online;
    if (!online) return ['Offline', 'r'];
    if (eaOff(m)) return ['Stopped', 'r'];
    if (p?.entry_state === 'blocked') return ['Blocked', 'r'];
    if (p?.entry_state === 'paused') return ['Paused', 'y'];
    return ['Running', 'g'];
  }
  // Trades of the overview period filtered by the symbol picker, oldest first.
  const ovTrades = () => S.trades.filter(t => S.sym === 'ALL' || t.symbol === S.sym).slice().reverse();
  function tradeKpis(ts) {
    const wins = ts.filter(t => t.net > 0), losses = ts.filter(t => t.net < 0);
    const gp = sum(wins, t => t.net), gl = -sum(losses, t => t.net), net = sum(ts, t => t.net);
    let cum = 0, peak = 0, dd = 0; const curve = [0];
    ts.forEach(t => { cum += t.net; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); curve.push(cum); });
    const bal = tel()?.account?.balance || 0, startBal = bal - net;
    return { n: ts.length, wins: wins.length, losses: losses.length, gp, gl, net, dd, curve,
      wr: ts.length ? wins.length / ts.length * 100 : null, pf: gl ? gp / gl : null,
      avgW: wins.length ? gp / wins.length : null, avgL: losses.length ? -gl / losses.length : null,
      exp: ts.length ? net / ts.length : null, netPct: startBal > 0 ? net / startBal * 100 : null, ddPct: startBal > 0 ? dd / (startBal + peak) * 100 : null };
  }
  function baskets() {
    const map = new Map();
    (tel()?.positions || []).forEach(p => {
      const k = p.magic + '|' + p.symbol;
      if (!map.has(k)) map.set(k, { magic: p.magic, symbol: p.symbol, pos: [] });
      map.get(k).pos.push(p);
    });
    return [...map.values()].map(b => {
      const today = S.deals.filter(d => d.magic === b.magic && d.symbol === b.symbol && ['OUT', 'INOUT', 'OUT_BY'].includes(d.entry));
      const realized = sum(today, d => d.profit + d.swap + d.commission + d.fee);
      const floating = sum(b.pos, p => p.profit), buy = sum(b.pos.filter(p => p.side === 'BUY'), p => p.volume), sell = sum(b.pos.filter(p => p.side === 'SELL'), p => p.volume);
      const first = b.pos.reduce((a, p) => p.time < a.time ? p : a, b.pos[0]);
      const sorted = b.pos.slice().sort((x, y) => x.time - y.time);
      return { ...b, id: basketId(b.magic, b.symbol), lots: buy + sell, initLot: sorted[0].volume,
        hedge: Math.max(buy, sell) ? Math.min(buy, sell) / Math.max(buy, sell) : 0, realized, floating, net: realized + floating,
        age: (tel().server_time || 0) - first.time };
    }).sort((a, b) => a.magic - b.magic);
  }

  // ---------- top bar & sidebar ----------
  function renderChrome() {
    const t = tel(), a = t?.account, online = S.st?.agent?.online, conn = online && t?.terminal_connected;
    const syms = [...new Set([...(t?.positions || []).map(p => p.symbol), ...S.statsPer.flatMap(e => Object.keys(e.symbols))])];
    $('tbSyms').textContent = (syms.length ? syms.slice(0, 3).join(' • ') + ' • ' : '') + 'Real-Time • Automated';
    $('tbConn').innerHTML = `<b><span class="dot ${conn ? 'g' : 'r'}"></span><span class="${conn ? 'up' : 'down'}">${conn ? 'MT5 Connected' : online ? 'MT5 terputus dari broker' : 'Agent offline'}</span></b>
      <span>Server: ${esc(a?.server || '–')}</span><span>Login: ${esc(a?.login ?? '–')}${a ? ' · ' + (a.demo ? 'Demo' : 'Real') : ''}</span>`;
    const m = (l, v, c = '') => `<div class="m"><small>${l}</small><b class="${c}">${v}</b></div>`;
    $('tbAcct').innerHTML = a ? `<div class="m"><small class="ttl">Account (${esc(viewCur())})</small><select id="curSel" aria-label="Mata uang tampilan">${CURS.map(c => `<option value="${c}" ${c === viewCur() ? 'selected' : ''} ${usdPer(c) && usdPer(acctCur()) ? '' : 'disabled'}>${c}${c === 'IDR' && !idrRate() ? ' (atur kurs)' : ''}</option>`).join('')}</select></div>`
      + m('Balance', fmtNum(a.balance)) + m('Equity', fmtNum(a.equity)) + m('Free Margin', fmtNum(a.free_margin)) + m('Margin', fmtNum(a.margin))
      + m('Margin Level', a.margin_level ? a.margin_level.toFixed(2) + '%' : '–', a.margin_level && a.margin_level < 200 ? 'down' : 'up')
      + (idrRate() ? `<button class="m fxchip" data-go="fx" aria-label="Buka Kurs USD"><small>USD/IDR${!brokerIdr() && S.fx?.live ? ' · live' : ''}</small><b>${idrRate().toLocaleString('id-ID', { maximumFractionDigits: 0 })}</b></button>` : '')
      : `<span class="muted">Menunggu data akun dari agent…</span>`;
    $('navPos').textContent = t?.positions?.length ?? 0;
    $('navBkt').textContent = t ? baskets().length : 0;
    $('verTag').textContent = 'agent ' + (t?.agent_version || '–');
    $('symList').innerHTML = (t?.symbols || []).slice().sort((x, y) => (syms.includes(y.symbol) - syms.includes(x.symbol))).slice(0, 3).map(s => {
      const ch = s.day_open ? (s.bid - s.day_open) / s.day_open * 100 : null, h = S.hist[s.symbol] || [];
      return `<div class="symrow">${coinHtml(s.symbol)}<div><b>${esc(s.symbol)}</b><span class="num">${fmtPx(s.bid, s.digits)}</span><span class="num ${cls(ch)}" style="font-size:12.5px">${ch == null ? '' : pct(ch)}</span></div>${spark(h, ch < 0 ? 'var(--down)' : 'var(--up)', 64, 30, false)}</div>`;
    }).join('') || '<span class="muted">–</span>';
    document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.view === S.view));
  }
  function tickClock() {
    const d = new Date(), off = -d.getTimezoneOffset() / 60;
    $('tbDate').textContent = d.toLocaleDateString('id-ID', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
    $('tbClock').textContent = d.toLocaleTimeString('id-ID') + ` (UTC${off >= 0 ? '+' : ''}${off})`;
  }

  // ---------- overview widgets ----------
  function filterBar() {
    const syms = [...new Set([...S.trades.map(t => t.symbol), ...(tel()?.positions || []).map(p => p.symbol)])].sort();
    const now = tel()?.server_time;
    return `<section class="card fbar">
      <label class="f"><span>Symbol</span><select id="fSym">${['ALL', ...syms].map(s => `<option value="${s}" ${s === S.sym ? 'selected' : ''}>${s === 'ALL' ? 'ALL' + (syms.length ? ' (' + syms.join(', ') + ')' : '') : esc(s)}</option>`).join('')}</select></label>
      <label class="f"><span>Periode</span><select id="fDays">${Object.entries(PERIODS).map(([d, l]) => `<option value="${d}" ${+d === S.days ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <span class="range">${icon('i-cal')}<span class="mono">${S.tradesStart ? srvDay(S.tradesStart) : '–'}</span>${icon('i-arrow')}<span class="mono">${now ? srvDay(now) : '–'}</span></span>
      <button class="btn primary" data-act="refresh">${icon('i-sync')}Refresh</button>
      <span class="live"><span class="dot ${S.st?.agent?.online ? 'g' : 'r'}"></span><b class="${S.st?.agent?.online ? '' : 'down'}">${S.st?.agent?.online ? 'Live Update' : 'Agent offline'}</b>Last update: <span class="mono" id="lastUpd">${S.lastUpdate ? new Date(S.lastUpdate).toLocaleTimeString('id-ID') : '–'}</span></span>
    </section>`;
  }
  function kpiRow() {
    const k = tradeKpis(ovTrades());
    return `<div class="kpis">
      <div class="card kpi"><div class="lbl">Net P/L ${icon('i-info')}</div><div class="val ${cls(k.net)}">${fmtNum(k.net, true)}<small>${viewCur()}</small></div>

          ${ticks.map(v => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
          <path d="${path(main)}L${x(last[0])},${H}L0,${H}Z" fill="url(#eqg)"/>
          <path d="${path(main)}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
          ${series[1] ? `<path d="${path(series[1])}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>` : ''}

        ev.push({ ts: d.time, magic: d.magic, symbol: d.symbol, ev: 'TRADE', msg });
      } else ev.push({ ts: d.time, magic: null, symbol: '–', ev: 'INFO', msg: `${esc(d.type)} ${fmtMoney(d.profit, true)}${d.comment ? ' · ' + esc(d.comment) : ''}` });

  // ---------- trading sessions ----------
  // Session hours are kept in each city's own local time, as the agent's session filter (0.16+) uses them,
  // and shown in the time zone the viewer picks. Each trade belongs to one session by its opening time:
  // Overlap (London and New York both open) first, then London, New York, Asia, else "Di luar sesi".
  const SESS = [
    { k: 'asia', name: 'Asia', tz: 'Asia/Tokyo', city: 'Tokyo', def: '09:00-18:00', color: '#f5a524' },
    { k: 'london', name: 'London', tz: 'Europe/London', city: 'London', def: '08:00-17:00', color: '#2f7cf6' },
    { k: 'newyork', name: 'New York', tz: 'America/New_York', city: 'New York', def: '08:00-17:00', color: '#f04452' },
    { k: 'overlap', name: 'Overlap', sub: 'London & New York', color: '#22c55e' },
  ];
  const SESS_OFF = { k: 'off', name: 'Di luar sesi', color: '#6f829e' };
  const SESS_BY = Object.fromEntries([...SESS, SESS_OFF].map(x => [x.k, x]));
  const SESS_TZS = [['Asia/Jakarta', 'Jakarta (WIB)'], ['UTC', 'UTC'], ['Asia/Tokyo', 'Tokyo (JST)'], ['Europe/London', 'London'], ['America/New_York', 'New York']];
  const SERIES = ['#3b82f6', '#f5a524', '#14b8a6'];
  const tzFmt = {};
  const tzParts = (tz, ms) => {
    const f = tzFmt[tz] ||= new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', weekday: 'short' });
    const o = {}; f.formatToParts(ms).forEach(x => { if (x.type !== 'literal') o[x.type] = x.type === 'weekday' ? x.value : +x.value; }); return o;
  };
  const tzOffset = (tz, ms) => { const p = tzParts(tz, ms); return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute) - Math.floor(ms / 60000) * 60000) / 60000); };
  // epoch ms of a wall-clock time in tz; d may run past the month's end (Date.UTC normalises it)
  const wallToUtc = (tz, y, m, d, min) => { const g = Date.UTC(y, m - 1, d) + min * 60000; return g - tzOffset(tz, g - tzOffset(tz, g) * 60000) * 60000; };
  const hm = r => r.split('-').map(x => +x.slice(0, 2) * 60 + +x.slice(3, 5));
  const sessHours = k => tel()?.sessions?.[k + '_hours'] || SESS_BY[k].def;
  // open intervals [from, to) in epoch ms of session k that touch [a, b)
  function sessWindows(k, a, b) {
    if (k === 'overlap') {
      const N = sessWindows('newyork', a, b), out = [];
      sessWindows('london', a, b).forEach(x => N.forEach(y => { const f = Math.max(x[0], y[0]), t = Math.min(x[1], y[1]); if (f < t) out.push([f, t]); }));
      return out;
    }
    const { tz } = SESS_BY[k], [s, e] = hm(sessHours(k)), p = tzParts(tz, a), out = [];
    for (let i = -1; i <= Math.ceil((b - a) / 864e5) + 1; i++) {
      const from = wallToUtc(tz, p.year, p.month, p.day + i, s), to = wallToUtc(tz, p.year, p.month, p.day + i + (e > s ? 0 : 1), e);
      if (to > a && from < b) out.push([from, to]);
    }
    return out;
  }
  // classifier for times in [a, b): the sessions open at ms, and the one session a trade at ms belongs to
  function sessClassifier(a, b) {
    const W = Object.fromEntries(SESS.map(x => [x.k, sessWindows(x.k, a, b)]));
    const open = ms => SESS.filter(x => W[x.k].some(w => w[0] <= ms && ms < w[1])).map(x => x.k);
    return { W, open, bucket: ms => { const o = open(ms); return ['overlap', 'london', 'newyork', 'asia'].find(k => o.includes(k)) || 'off'; } };
  }
  const dispTz = () => S.sessTz || 'Asia/Jakarta';
  const tzTime = (ms, tz, sec) => new Date(ms).toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23', ...(sec ? { second: '2-digit' } : {}) });
  const tzDate = (ms, tz) => new Date(ms).toLocaleDateString('id-ID', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
  const utcLabel = (tz, ms) => { const o = tzOffset(tz, ms), h = Math.floor(Math.abs(o) / 60), m = Math.abs(o) % 60; return 'UTC' + (o < 0 ? '−' : '+') + h + (m ? ':' + String(m).padStart(2, '0') : ''); };
  const zoneAbbr = (tz, ms) => ({ 'Asia/Jakarta': 'WIB', 'Asia/Tokyo': 'JST', UTC: '', 'Europe/London': tzOffset(tz, ms) ? 'BST' : 'GMT', 'America/New_York': tzOffset(tz, ms) === -240 ? 'EDT' : 'EST' }[tz] ?? '');

  // forex is shut from Friday 17:00 to Sunday 17:00 New York time
  const fxWeekend = ms => { const p = tzParts('America/New_York', ms); return p.weekday === 'Sat' || (p.weekday === 'Fri' && p.hour >= 17) || (p.weekday === 'Sun' && p.hour < 17); };

  // closed trades of the period, each tagged with its session (cached until the trades, hours or server offset change)
  function sessTrades() {
    const off = srvOffset(), key = [S.sessStamp, off, ...['asia', 'london', 'newyork'].map(sessHours)].join('|');
    if (S.sessCache?.key === key) return S.sessCache.trades;
    const ts = (S.sessTrades || []).map(t => ({ ...t, at: ((t.open_time ?? t.close_time) - off) * 1000 })).sort((x, y) => x.close_time - y.close_time);
    const c = ts.length ? sessClassifier(Math.min(...ts.map(t => t.at)) - 864e5, Math.max(...ts.map(t => t.at)) + 864e5) : null;
    ts.forEach(t => { t.sess = c.bucket(t.at); });
    S.sessCache = { key, trades: ts };
    return ts;
  }
  function sessStats(ts) {
    const out = Object.fromEntries([...SESS, SESS_OFF].map(x => [x.k, { k: x.k, n: 0, win: 0, loss: 0, net: 0, gp: 0, gl: 0, vol: 0, cum: 0, peak: 0, dd: 0 }]));
    ts.forEach(t => { const b = out[t.sess]; b.n++; b.vol += t.volume; b.net += t.net; b.cum += t.net;
      if (t.net > 0) { b.win++; b.gp += t.net; } else if (t.net < 0) { b.loss++; b.gl -= t.net; }
      b.peak = Math.max(b.peak, b.cum); b.dd = Math.max(b.dd, b.peak - b.cum); });
    return out;
  }
  const sessKeys = st => [...SESS.map(x => x.k), ...(st.off.n ? ['off'] : [])];
  const sessDot = k => `<span class="dot" style="color:${SESS_BY[k].color}"></span>`;

  function sessClocks(now, c) {

    return `<div class="clkrow">${card('Asia/Jakarta', 'Jakarta (WIB)')}${card('UTC', 'UTC')}${card('Europe/London', 'London', 'london')}${card('America/New_York', 'New York', 'newyork')}</div>`;
  }
  function sessNowCard(now, c) {
    const open = c.open(now), cur = c.bucket(now), tz = dispTz();
    return `<section class="card"><div class="ph"><h2>Status Sesi Saat Ini</h2><span class="chip ${cur === 'off' ? '' : 'g'}">${sessDot(cur)}${cur === 'off' ? 'Di luar sesi' : SESS_BY[cur].name + ' Session'}</span></div>
      <div class="srows">${SESS.map(x => {
        const w = c.W[x.k].find(v => v[1] > now), on = open.includes(x.k), soon = !on && w && w[0] - now < 3 * 3600e3;
        return `<div><span>${sessDot(x.k)}<b>${x.name}</b></span>
          <span class="${on ? 'up' : soon ? 'warn' : 'muted'}">${on ? 'Aktif' : soon ? 'Buka ' + dur((w[0] - now) / 1000) + ' lagi' : 'Tutup'}</span>
          <span class="mono">${w ? tzTime(w[0], tz) + ' - ' + tzTime(w[1], tz) : '–'}</span></div>`; }).join('')}</div>
      <div class="pf">${fxWeekend(now) ? '<span class="warn">Pasar forex libur akhir pekan</span> · ' : ''}Jam ditampilkan dalam ${esc(tzLabel(tz))}.</div></section>`;
  }

  }
  const loadEquity = async () => { S.eq = (await api('/equity?hours=' + Math.min(192, S.days * 24))).samples; };
  const loadCmds = async () => { S.cmds = (await api('/commands?limit=100')).commands; };
  const loadFx = async () => { S.fx = await api('/fx' + (S.view === 'fx' ? '?history=1' : '')); S.fxAt = Date.now(); };
  const loadUsers = async () => { if (can('admin')) S.users = (await api('/users')).users; };
  async function loadStats() {
    const [day, per, tr, dl] = await Promise.all([
      api('/eas/stats?period=day'), api('/eas/stats?period=' + S.perfTab), api('/trades?days=' + S.days), api('/deals?limit=300'), api('/balance?days=' + S.days).then(r => { S.bal = r; })]);
    S.statsDay = day.eas; S.statsPer = per.eas; S.perStart = per.start; S.trades = tr.trades; S.tradesStart = tr.start; S.deals = dl.deals; S.dealsStart = dl.start;
    if (S.view === 'history') S.histTrades = (await api('/trades?days=' + S.histDays)).trades;
    if (S.view === 'session') await loadSess();
  }
  function every(ms, fn) { const run = () => fn().catch(e => console.warn(e)); run(); S.timers.push(setInterval(run, ms)); }
  function startPolling() {
    S.timers.forEach(clearInterval); S.timers = [];
    every(2000, async () => { await loadState(); safeRender(); });
    every(15000, async () => { await loadStats(); safeRender(); });
    every(30000, async () => { await loadEquity(); safeRender(); });
    every(15000, async () => { if (!S.fx?.usd_idr || S.view === 'fx' || Date.now() - S.fxAt > 60000) { await loadFx(); safeRender(); } });
    every(5000, async () => { if (['settings', 'eas'].includes(S.view)) { await loadCmds(); safeRender(); } });
    S.timers.push(setInterval(() => { tickClock(); document.querySelectorAll('[data-clk]').forEach(el => { el.textContent = tzTime(Date.now(), el.dataset.clk, true); }); const a = $('telAgo'), g = ago(); if (a && g != null) a.textContent = Math.round(g) + ' detik lalu'; }, 1000));
    tickClock();
  }
  async function refreshAll() { try { await Promise.all([loadState(), loadStats(), loadEquity(), loadCmds()]); render(); toast('Data diperbarui.'); } catch (e) { toast(e.message, 'err'); } }

  async function sendCommand(body, label) {
    if (S.pending) return;
    try {
      const { id } = await api('/commands', { method: 'POST', body });
      S.pending = { id, label }; render();
      const started = Date.now();
      while (Date.now() - started < 130000) {
        await new Promise(r => setTimeout(r, 1000));
        const c = await api('/commands/' + id);
        if (c.status === 'pending') continue;
        S.pending = null;
        if (c.status === 'acked') toast(`${label}: ${c.result || 'dikonfirmasi agent'}`);
        else if (c.status === 'failed') toast(`${label} ditolak agent: ${c.result}`, 'err');
        else toast(`${label} kedaluwarsa: agent tidak merespons.`, 'err');
        await Promise.all([loadState(), loadCmds()]); render(); return;
      }
      S.pending = null; render();
    } catch (e) { S.pending = null; toast(e.message, 'err'); render(); }
  }
  // All EAs at once: one command per magic, applied by the agent on its next polls.
  async function bulkEa(on) {
    const ms = eaMagics().filter(m => eaOff(m) === on);
    if (!ms.length) { toast(on ? 'Semua EA sudah aktif.' : 'Semua EA sudah nonaktif.'); return; }
    try { for (const m of ms) await api('/commands', { method: 'POST', body: { type: on ? 'enable_magic' : 'disable_magic', magic: m } });
      toast(`${ms.length} perintah ${on ? 'aktifkan' : 'nonaktifkan'} EA dikirim ke agent.`); await loadCmds(); render(); }
    catch (e) { toast(e.message, 'err'); }
  }

  // ---------- login ----------
  function showLogin() {
    S.timers.forEach(clearInterval); S.timers = []; S.me = null;
    $('appView').hidden = true; $('loginView').hidden = false; $('lu').focus();
  }
  async function showApp(me) {
    S.me = me;
    $('loginView').hidden = true; $('appView').hidden = false;
    $('uname').textContent = me.display_name; $('urole').textContent = ROLE_LABEL[me.role];
    $('avatar').textContent = me.display_name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    $('navUsers').hidden = me.role !== 'admin';
    S.view = 'overview'; render(); startPolling();
  }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('loginErr').textContent = '';
    try { showApp(await api('/auth/login', { method: 'POST', body: { username: $('lu').value, password: $('lp').value } })); $('lp').value = ''; }
    catch (err) { $('loginErr').textContent = err.message; }
  });

  // ---------- events ----------
  document.addEventListener('click', async e => {
    const nav = e.target.closest('[data-view],[data-go]');
    if (nav) {
      S.view = nav.dataset.view || nav.dataset.go; S.confirm = false; S.edit = null; window.scrollTo(0, 0);
      try { if (S.view === 'settings' || S.view === 'eas') await loadCmds(); if (S.view === 'users') await loadUsers();
        if (S.view === 'history') S.histTrades = (await api('/trades?days=' + S.histDays)).trades;
        if (S.view === 'fx') await loadFx();
        if (S.view === 'session') await loadSess(); } catch (err) { toast(err.message, 'err'); }
      render(); return;
    }
    if (e.target.closest('#themeBtn')) { const t = theme() === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; pref.set('theme', t); showTheme(); return; }
    const ub = e.target.closest('#userBtn'), menu = $('userMenu');
    if (ub) { menu.hidden = !menu.hidden; ub.setAttribute('aria-expanded', String(!menu.hidden)); return; }
    if (!e.target.closest('.user')) menu.hidden = true;
    const mw = e.target.closest('[data-mwtf]');
    if (mw) { S.mwTf = mw.dataset.mwtf; pref.set('mwTf', S.mwTf); render(); return; }
    const d = e.target.closest('[data-eq],[data-dp],[data-perf],[data-hsym]');
    if (d) {
      if (d.dataset.eq) S.eqTab = d.dataset.eq;
      if (d.dataset.dp) S.dpTab = d.dataset.dp;
      if (d.dataset.hsym) S.histSym = d.dataset.hsym;
      if (d.dataset.perf) { S.perfTab = d.dataset.perf; try { const r = await api('/eas/stats?period=' + S.perfTab); S.statsPer = r.eas; S.perStart = r.start; } catch (err) { toast(err.message, 'err'); } }
      render(); return;
    }
    const sr = e.target.closest('[data-sr]');
    if (sr && !sr.disabled) {
      const st = tel()?.strategies?.[0], a = sr.dataset.sr;
      if (a === 'toggle' && st) sendCommand({ type: 'sr_set', enabled: !st.enabled }, st.enabled ? 'Matikan StopReverse' : 'Nyalakan StopReverse');
      else if (a === 'close') { S.srConfirm = true; render(); }
      else if (a === 'cancel') { S.srConfirm = false; render(); }
      else if (a === 'closego') { S.srConfirm = false; sendCommand({ type: 'sr_close' }, 'Tutup posisi StopReverse'); }
      return;
    }
    const sd = e.target.closest('[data-sdist]');
    if (sd) { S.sessDist = sd.dataset.sdist; render(); return; }
    const se = e.target.closest('[data-sedit]');
    if (se && !se.disabled) { S.sessEdit = se.dataset.sedit === '1'; render(); return; }
    const sa = e.target.closest('[data-sallow]');
    if (sa && !sa.disabled) {
      const k = sa.dataset.sallow, cur = (tel()?.sessions?.allow || '').split(',').filter(Boolean);
      const next = cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k];
      if (!next.length) { toast('Pilih minimal satu sesi yang diizinkan.', 'err'); return; }
      sendCommand({ type: 'session_set', allow: SESS.map(x => x.k).filter(x => next.includes(x)).join(',') }, `${cur.includes(k) ? 'Larang' : 'Izinkan'} sesi ${SESS_BY[k].name}`); return;
    }
    const sf = e.target.closest('[data-sfilter]');
    if (sf && !sf.disabled) { const on = !!tel()?.sessions?.enabled; sendCommand({ type: 'session_set', enabled: !on }, on ? 'Matikan filter sesi' : 'Nyalakan filter sesi'); return; }
    const rk = e.target.closest('[data-risk]');
    if (rk && !rk.disabled) { const on = tel()?.protection?.enabled !== false; sendCommand({ type: 'risk_set', enabled: !on }, on ? 'Matikan proteksi rugi' : 'Nyalakan proteksi rugi'); return; }
    const mg = e.target.closest('[data-magic]');
    if (mg && !mg.disabled) { const m = +mg.dataset.magic, off = eaOff(m); sendCommand({ type: off ? 'enable_magic' : 'disable_magic', magic: m }, `${off ? 'Start' : 'Stop'} ${eaLabel(m)}`); return; }
    const ed = e.target.closest('[data-edit]');
    if (ed && !ed.disabled) { S.edit = +ed.dataset.edit; render(); return; }
    const dt = e.target.closest('[data-detail]');
    if (dt) { S.detail = +dt.dataset.detail; S.detailTrades = []; render();
      try { S.detailTrades = (await api('/trades?days=30&magic=' + S.detail)).trades; } catch (err) { toast(err.message, 'err'); } render(); return; }
    const ua = e.target.closest('[data-uactive]');
    if (ua && !ua.disabled) { try { await api('/users/' + ua.dataset.uactive, { method: 'PATCH', body: { active: !ua.classList.contains('on') } }); await loadUsers(); toast('Status pengguna diperbarui.'); } catch (err) { toast(err.message, 'err'); } render(); return; }
    const actEl = e.target.closest('[data-act]'), act = actEl?.dataset.act; if (!act) return;
    if (act === 'closemodal') { if (e.target === actEl || actEl.tagName === 'BUTTON') { S.detail = null; render(); } return; }
    if (act === 'logout') { try { await api('/auth/logout', { method: 'POST', body: {} }); } catch (_) {} showLogin(); }
    if (act === 'refresh') refreshAll();
    if (act === 'sessrefresh') { try { await Promise.all([loadState(), loadSess()]); toast('Data sesi diperbarui.'); } catch (err) { toast(err.message, 'err'); } render(); }
    if (act === 'allon' || act === 'alloff') bulkEa(act === 'allon');
    if (act === 'editcancel') { S.edit = null; render(); }
    if (act === 'logclear') { S.logEa = S.logSym = S.logEv = ''; render(); }
    if (act === 'pause') { S.confirm = true; render(); }
    if (act === 'cancel') { S.confirm = false; render(); }
    if (act === 'unblock') { S.confirm = 'unblock'; render(); }
    if (act === 'unblockgo') { S.confirm = false; sendCommand({ type: 'risk_reset' }, 'Buka blokir'); }
    if (act === 'send') { S.confirm = false; const paused = tel()?.protection?.entry_state === 'paused'; sendCommand({ type: paused ? 'resume_entry' : 'pause_entry' }, paused ? 'Lanjutkan entry' : 'Jeda entry'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.detail != null) { S.detail = null; render(); } });
  document.addEventListener('change', async e => {
    const el = e.target, id = el.id;
    if (id === 'curSel') { S.cur = el.value; pref.set('cur', S.cur); }
    else if (id === 'fSym') S.sym = el.value;
    else if (id === 'fBkt') S.basketSym = el.value;
    else if (id === 'riskMode') S.riskMode = el.value;
    else if (id === 'sessTz') { S.sessTz = el.value; pref.set('sessTz', el.value); }
    else if (id === 'sessSym') S.sessSym = el.value;
    else if (id === 'sessDays') { S.sessDays = +el.value; el.blur(); try { await loadSess(); } catch (err) { toast(err.message, 'err'); } }
    else if (id === 'lEa') S.logEa = el.value;
    else if (id === 'lSym') S.logSym = el.value;
    else if (id === 'lEv') S.logEv = el.value;
    else if (id === 'fDays') { S.days = +el.value; el.blur(); try { await Promise.all([loadStats(), loadEquity()]); } catch (err) { toast(err.message, 'err'); } }
    else if (id === 'hDays') { S.histDays = +el.value; el.blur(); try { S.histTrades = (await api('/trades?days=' + S.histDays)).trades; } catch (err) { toast(err.message, 'err'); } }
    else if (el.closest('[data-urole]')) { const r = el.closest('[data-urole]'); try { await api('/users/' + r.dataset.urole, { method: 'PATCH', body: { role: r.value } }); await loadUsers(); toast('Peran diperbarui. Pengguna perlu login ulang.'); } catch (err) { toast(err.message, 'err'); } }
    else return;
    el.blur(); render();
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'fxUsd' || e.target.id === 'fxIdr') {  // update the other field in place; a render would steal focus
      const r = idrRate(), v = parseFloat(e.target.value);
      if (!r) return;
      if (e.target.id === 'fxUsd') { S.fxUsd = v; $('fxIdr').value = Number.isFinite(v) ? Math.round(v * r) : ''; }
      else { S.fxUsd = v / r; $('fxUsd').value = Number.isFinite(v) ? (v / r).toFixed(2) : ''; }
      return;
    }
    if (e.target.id !== 'hQ') return;
    S.histQ = e.target.value; const pos = e.target.selectionStart; render();
    const q = $('hQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  });
  document.addEventListener('submit', async e => {
    const f = e.target; if (f.id === 'loginForm') return;
    e.preventDefault();
    try {
      if (f.id === 'fxForm') { const v = parseFloat($('fxIn').value); if (!(v >= 1000)) throw new Error('Kurs tidak valid'); pref.set('usdIdr', String(v)); toast('Kurs disimpan'); }
      else if (f.id === 'srForm') {
        const body = { type: 'sr_set', symbol: $('srSym').value.trim(), lots: parseFloat($('srLots').value), dist: parseFloat($('srDist').value), step: parseFloat($('srStep').value) };
        document.activeElement?.blur(); await sendCommand(body, 'Simpan pengaturan StopReverse');
      }
      else if (f.id === 'sessForm') {
        const body = { type: 'session_set' };
        SESS.filter(x => x.tz).forEach(x => { body[x.k + '_hours'] = $(`sh-${x.k}-a`).value + '-' + $(`sh-${x.k}-b`).value; });
        if (SESS.some(x => x.tz && body[x.k + '_hours'].split('-')[0] === body[x.k + '_hours'].split('-')[1])) throw new Error('Jam buka dan tutup sesi tidak boleh sama');
        document.activeElement?.blur(); S.sessEdit = false; await sendCommand(body, 'Simpan jadwal sesi');
      }
      else if (f.id === 'riskForm') {
        const v = parseFloat($('riskVal').value), mode = $('riskMode').value, v016 = tel()?.protection?.enabled !== undefined;
        document.activeElement?.blur();
        await sendCommand(v016 ? { type: 'risk_set', mode, value: v } : { type: 'set_limit', value: v },
          mode === 'pct' ? `Ubah batas rugi ke ${v}%` : `Ubah batas rugi ke ${fmtMoney(v)}`);
        S.riskMode = null; await loadCmds();
      }
      else if (f.id === 'eaAdd') { await api('/eas/' + $('eaAddMagic').value, { method: 'PUT', body: { name: $('eaAddName').value, scope: '' } }); toast('EA didaftarkan.'); }
      else if (f.dataset.eaform) { const m = f.dataset.eaform; await api('/eas/' + m, { method: 'PUT', body: { name: $('ean-' + m).value, scope: $('eas-' + m).value } }); S.edit = null; toast('EA disimpan.'); }
      else if (f.id === 'userAdd') { await api('/users', { method: 'POST', body: { username: $('nu-user').value, display_name: $('nu-name').value, role: $('nu-role').value, password: $('nu-pw').value } }); await loadUsers(); toast('Pengguna ditambahkan.'); }
      else if (f.dataset.upw) { await api('/users/' + f.dataset.upw, { method: 'PATCH', body: { password: $('upw-' + f.dataset.upw).value } }); toast('Kata sandi diperbarui. Sesi pengguna itu diakhiri.'); }
      document.activeElement?.blur(); await loadState(); render();
    } catch (err) { toast(err.message, 'err'); }
  });

  api('/auth/me').then(showApp).catch(showLogin);
})();
</script>
</body>
</html>

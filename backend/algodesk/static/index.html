<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlgoDesk MT5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Navy trading-journal look: top account bar, sidebar, dense panels (from the user's reference screens) */
:root {
  color-scheme: dark;
  --bg: #08111f;
  --panel: #0d1a2e;
  --panel-2: #11223b;
  --panel-3: #16294a;
  --line: #1c3253;
  --line-soft: #162a47;
  --fg: #e9eef7;
  --fg-2: #aab8cc;
  --muted: #6f829e;
  --accent: #2f7cf6;
  --accent-2: #1f5fd0;
  --accent-bg: #12305e;
  --up: #22c55e;
  --up-bg: #0f3424;
  --down: #f04452;
  --down-bg: #3c1520;
  --warn: #f5a524;
  --warn-bg: #3a2a10;
  --cyan: #22b8f0;
  --purple: #8b6cf6;
  --gold: #e8a33c;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef2f8; --panel: #ffffff; --panel-2: #f3f6fb; --panel-3: #e8eef8; --line: #d9e1ee; --line-soft: #e6ecf5;
    --fg: #0f1b2d; --fg-2: #3c4b62; --muted: #6a7a92;
    --accent: #1f6ae6; --accent-2: #1756c0; --accent-bg: #dce8fd;
    --up: #128a4a; --up-bg: #dcf3e6; --down: #d12c3c; --down-bg: #fbe2e5; --warn: #b26b00; --warn-bg: #fbeed5;
    --cyan: #0b84b8; --purple: #6a48d8; --gold: #b7791f;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef2f8; --panel: #ffffff; --panel-2: #f3f6fb; --panel-3: #e8eef8; --line: #d9e1ee; --line-soft: #e6ecf5;
  --fg: #0f1b2d; --fg-2: #3c4b62; --muted: #6a7a92;
  --accent: #1f6ae6; --accent-2: #1756c0; --accent-bg: #dce8fd;
  --up: #128a4a; --up-bg: #dcf3e6; --down: #d12c3c; --down-bg: #fbe2e5; --warn: #b26b00; --warn-bg: #fbeed5;
  --cyan: #0b84b8; --purple: #6a48d8; --gold: #b7791f;
}
* { box-sizing: border-box; }
svg { width: 16px; height: 16px; flex: none; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13.5px; line-height: 1.45; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.g { color: var(--up); } .dot.r { color: var(--down); } .dot.y { color: var(--warn); } .dot.b { color: var(--accent); } .dot.m { color: var(--muted); }

/* ---------- top account bar ---------- */
.top { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 72px; }
.top > div { display: flex; align-items: center; padding: 10px 20px; border-right: 1px solid var(--line); min-width: 0; }
.tb-brand { gap: 14px; width: 340px; flex: none; }
.tb-brand .logo { display: flex; gap: 3px; align-items: flex-end; height: 30px; }
.tb-brand .logo i { width: 7px; border-radius: 2px; background: var(--accent); }
.tb-brand b { display: block; font-size: 16.5px; letter-spacing: .04em; font-weight: 700; }
.tb-brand small { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 260px; }
.tb-conn { flex-direction: column; align-items: flex-start !important; justify-content: center; gap: 1px; font-size: 12px; color: var(--fg-2); flex: none; }
.tb-conn b { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.tb-acct { flex: 1; gap: 8px 20px; flex-wrap: wrap; }
.tb-acct select { padding: 2px 6px; font-size: 12px; margin-top: 2px; display: block; }
.tb-acct .m small { display: block; color: var(--fg-2); font-size: 11.5px; }
.tb-acct .m b { font-family: var(--mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
.tb-acct .ttl { font-weight: 600; font-size: 12.5px; }
.tb-time { flex-direction: column; align-items: flex-start !important; justify-content: center; font-size: 13px; flex: none; gap: 2px; }
.tb-time select { margin-top: 2px; }
.user { position: relative; border-right: 0 !important; flex: none; }
.user > button { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; text-align: left; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-bg); color: var(--fg); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.user small { display: block; color: var(--muted); font-size: 12px; }
.menu { position: absolute; right: 12px; top: calc(100% - 4px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; min-width: 220px; z-index: 30; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
.menu button { display: flex; width: 100%; justify-content: space-between; background: none; border: 0; padding: 9px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--panel-2); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 73px); }
.side { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--fg-2); background: none; border: 0; cursor: pointer; text-align: left; width: 100%; font-size: 14px; }
.nav:hover { background: var(--panel-2); color: var(--fg); }
.nav.on { background: var(--accent); color: #fff; }
.nav svg { width: 19px; height: 19px; }
.nav .ct { margin-left: auto; min-width: 22px; height: 22px; border-radius: 11px; background: var(--panel-3); color: var(--fg); font-size: 12px; display: grid; place-items: center; padding: 0 6px; }
.nav.on .ct { background: rgba(255,255,255,.2); }
.navgroup { display: flex; flex-direction: column; gap: 3px; }
.symbox { margin-top: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.symbox h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.symrow { display: grid; grid-template-columns: 30px 1fr 64px; gap: 10px; align-items: center; }
.coin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #1a1205; background: var(--gold); }
.symrow b { display: block; font-size: 13px; }
.symrow .num { font-size: 14px; display: block; }
.symrow svg { width: 64px; height: 30px; }
.ver { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 10px 4px 0; }

main { padding: 18px 20px 24px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.phead h1 { font-size: 24px; margin: 0 0 2px; font-weight: 700; letter-spacing: -.01em; }
.phead p { margin: 0; color: var(--fg-2); }
.phead .acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- generic panels ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
.ph h2 { font-size: 15.5px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.ph p { margin: 2px 0 0; color: var(--fg-2); font-size: 12.5px; }
.ph .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g-ov1 { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1.1fr) minmax(0, .75fr); }
.g-ov2 { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.g-ea2 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; cursor: pointer; color: var(--fg); white-space: nowrap; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.green { background: var(--up); border-color: var(--up); color: #04220f; font-weight: 600; }
.btn.red { background: var(--down); border-color: var(--down); color: #fff; font-weight: 600; }
.btn.outline { background: none; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.icon { padding: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 13px; cursor: pointer; color: var(--fg-2); font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
select, input { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chip.g { background: var(--up-bg); color: var(--up); border-color: transparent; }
.chip.r { background: var(--down-bg); color: var(--down); border-color: transparent; }
.chip.y { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.b { background: var(--accent-bg); color: var(--cyan); border-color: transparent; }
.chip.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--fg-2); font-weight: 500; padding: 9px 12px; background: var(--panel-2); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.c, th.c { text-align: center; }
.side-b { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.side-b.buy { background: var(--up-bg); color: var(--up); } .side-b.sell { background: var(--down-bg); color: var(--down); }
.bkt { font-family: var(--mono); font-size: 12px; color: var(--cyan); background: var(--accent-bg); padding: 2px 7px; border-radius: 4px; }

/* filter bar */
.fbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; }
.fbar .f { display: flex; flex-direction: row; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 0 0 0 10px; background: var(--panel); }
.fbar .f span { color: var(--fg-2); font-size: 12.5px; }
.fbar .f select { border: 0; border-left: 1px solid var(--line); border-radius: 0 8px 8px 0; background: var(--panel-2); min-width: 120px; }
.fbar .range { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; color: var(--fg-2); }
.fbar .live { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--fg-2); font-size: 12.5px; }
.fbar .live b { color: var(--up); font-weight: 500; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; min-height: 112px; position: relative; }
.kpi .lbl { grid-column: 1 / -1; color: var(--fg-2); font-size: 13px; display: flex; justify-content: space-between; }
.kpi .val { font-family: var(--mono); font-size: 26px; font-weight: 600; white-space: nowrap; line-height: 1.15; }
.kpi .val small { font-size: 15px; margin-left: 4px; }
.kpi .sub { grid-column: 1 / -1; color: var(--fg-2); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
.kpi .sub b { display: block; font-family: var(--mono); color: var(--fg); font-weight: 500; font-size: 13px; }
.kpi .vis { grid-row: 2 / 4; grid-column: 2; align-self: center; }
.kpi .vis svg { width: 70px; height: 40px; }
.ring { width: 64px; height: 64px; }
.ring svg { width: 64px; height: 64px; }

/* charts */
.chart { position: relative; padding: 4px 16px 12px 56px; }
.chart svg.plot { width: 100%; height: 190px; display: block; overflow: visible; }
.yl { position: absolute; left: 6px; width: 46px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); transform: translateY(-50%); }
.xl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
.legend { display: flex; justify-content: center; gap: 18px; color: var(--fg-2); font-size: 12px; margin-top: 6px; }
.legend span { display: flex; gap: 6px; align-items: center; }
.legend i { width: 14px; border-top: 2px solid var(--up); }
.legend i.dash { border-top: 2px dashed var(--accent); }
.symperf { display: flex; flex-direction: column; }
.symperf .it { display: grid; grid-template-columns: 38px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.symperf .coin { width: 38px; height: 38px; font-size: 14px; }
.symperf b { font-size: 14px; }
.symperf .r { text-align: right; }
.symperf svg { width: 90px; height: 34px; }

/* basket & risk */
.basket { border: 1px solid var(--line); border-radius: 8px; margin: 0 12px 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.basket .bh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.basket .bh b { font-family: var(--mono); }
.basket .bh .muted { font-size: 12.5px; }
.basket .bh .op { margin-left: auto; color: var(--fg-2); font-size: 12.5px; }
.ring-o { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--up); }
.bgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 10px; }
.bgrid small { color: var(--fg-2); font-size: 11.5px; display: block; }
.bgrid b { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.bar { height: 7px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--up)); }
.bar.warn i { background: var(--warn); } .bar.crit i { background: var(--down); }
.bfoot { display: flex; gap: 14px; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-2); }
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; padding: 12px 16px; }
.rgrid small, .rmini small { color: var(--fg-2); font-size: 12px; display: block; }
.rgrid b, .rmini b { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.rmini { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line-soft); }
.rmini > div { padding: 10px 12px; border-right: 1px solid var(--line-soft); }
.rmini > div:last-child { border-right: 0; }
.rmini b { font-size: 14px; }

/* EA cards */
.eacards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.eac { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.eac .h { display: flex; justify-content: space-between; gap: 10px; }
.eac .h b { font-size: 15.5px; display: block; }
.eac .h small { color: var(--fg-2); font-size: 12.5px; }
.eac .st { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.sw { position: relative; width: 74px; height: 30px; border-radius: 15px; border: 0; cursor: pointer; background: var(--panel-3); color: var(--fg-2); font-size: 12px; font-weight: 600; text-align: right; padding: 0 12px; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw.on { background: var(--up); color: #fff; text-align: left; }
.sw.on::after { left: 48px; }
.sw[disabled] { opacity: .5; cursor: not-allowed; }
.run { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; border: 1px solid currentColor; }
.run.g { color: var(--up); } .run.r { color: var(--down); } .run.y { color: var(--warn); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; color: var(--fg-2); }
.kv b { color: var(--fg); font-family: var(--mono); font-weight: 500; text-align: right; }
.estat { display: grid; grid-template-columns: 1.35fr .9fr 1fr 1fr; border-top: 1px solid var(--line-soft); padding-top: 10px; }
.estat > div { padding: 0 6px; border-left: 1px solid var(--line-soft); min-width: 0; }
.estat > div:first-child { padding-left: 0; border-left: 0; }
.estat small { color: var(--fg-2); font-size: 11px; display: block; line-height: 1.25; min-height: 28px; }
.estat b { font-family: var(--mono); font-size: 16px; font-weight: 600; white-space: nowrap; }
.estat em { font-style: normal; font-family: var(--mono); font-size: 12px; display: block; }
.eac .spk svg { width: 100%; height: 44px; display: block; }
.eac .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.eac form { display: flex; flex-direction: column; gap: 8px; }
.donut { display: flex; gap: 22px; align-items: center; padding: 8px 18px 18px; flex-wrap: wrap; }
.donut svg { width: 150px; height: 150px; }
.donut ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 160px; }
.donut li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 12px; align-items: center; }
.ev { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.ev.INFO { background: var(--accent-bg); color: var(--cyan); } .ev.TRADE { background: var(--up-bg); color: var(--up); }
.ev.WARN { background: var(--warn-bg); color: var(--warn); } .ev.ERROR { background: var(--down-bg); color: var(--down); }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 4px 16px 12px; }
.res small { color: var(--fg-2); font-size: 12px; display: block; }
.res b { font-family: var(--mono); font-size: 16px; display: block; margin-bottom: 6px; }

/* protection (risk center page) */
.prot { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.state { display: flex; align-items: center; gap: 8px; }
.prow { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-2); gap: 8px; }
.confirm { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.confirm div { display: flex; gap: 8px; justify-content: flex-end; }
.center { text-align: center; color: var(--muted); font-size: 12.5px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; padding: 4px 16px 16px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--panel-3); border: 0; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: left .2s; }
.toggle.on { background: var(--up); } .toggle.on::after { left: 19px; background: #fff; }
.toggle[disabled] { opacity: .45; cursor: not-allowed; }
.pf { padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--fg-2); font-size: 12.5px; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--fg-2); }
.li span:last-child { margin-left: auto; color: var(--fg); }
.foot { color: var(--muted); font-size: 12px; }

/* modal & toasts */
.modal { position: fixed; inset: 0; background: rgba(3,8,16,.66); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .card { width: min(980px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.modal .tw { overflow: auto; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100% - 32px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--up); border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 24px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.err { border-left-color: var(--down); }
@keyframes tin { from { transform: translateY(8px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.login { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.login form { width: min(380px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.login h1 { font-size: 22px; margin: 0; }
.login .err { color: var(--down); font-size: 13px; min-height: 18px; }

@media (max-width: 1500px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-ov1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .g-ov1 > :last-child { grid-column: 1 / -1; }
  .tb-brand { width: auto; }
}
@media (max-width: 1180px) {
  .g-ov1, .g-ov2, .g-ea2, .g-2 { grid-template-columns: minmax(0, 1fr); }
  .top { flex-wrap: wrap; }
  .top > div { border-bottom: 1px solid var(--line); }
  .tb-acct { order: 5; flex-basis: 100%; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; padding: 8px 16px; }
  .navgroup { flex-direction: row; }
  .nav { width: auto; white-space: nowrap; padding: 8px 12px; }
  .symbox, .ver { display: none; }
  main { padding: 14px 16px 20px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rmini { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top > div { padding: 10px 16px; }
  .tb-brand small { max-width: 200px; }
  .fbar .live { margin-left: 0; }
}
@media (max-width: 520px) {
  .kpi { min-height: 0; padding: 12px; }
  .kpi .val { font-size: 20px; }
  .kpi .vis { display: none; }
  .top .tb-time { display: none; }
  .tb-brand { flex: 1; }
  .top .tb-conn, .user small, .user b { display: none; }
  .tb-brand b { font-size: 14px; }
  .tb-acct { gap: 14px; }
  .estat b { font-size: 14px; }
}
</style>

<script>
(() => {
  const ROLE_LABEL = { admin: 'Super Admin', trader: 'Trader', viewer: 'Viewer' };
  const CMD_LABEL = { pause_entry: 'Jeda entry', resume_entry: 'Lanjutkan entry', disable_magic: 'Nonaktifkan EA', enable_magic: 'Aktifkan EA', set_limit: 'Ubah batas rugi' };
  const STATUS_LABEL = { pending: 'Menunggu agent', acked: 'Dikonfirmasi agent', failed: 'Ditolak agent', expired: 'Kedaluwarsa' };
  const PERIODS = { 1: 'Hari ini', 7: '7 Hari', 30: '30 Hari' };
  const S = {
    me: null, st: null, fetchedAt: 0, eq: [], cmds: [], users: [], view: 'overview', confirm: false, pending: null,
    hist: {}, timers: [], lastUpdate: null,
    days: 7, sym: 'ALL', eqTab: 'equity', dpTab: 'pl', trades: [], tradesStart: null,
    statsDay: [], perfTab: 'day', statsPer: [], perStart: null, deals: [], dealsStart: null,
    logEa: '', logSym: '', logEv: '', histSym: 'ALL', histQ: '', histDays: 7, histTrades: [], basketSym: 'ALL',
    edit: null, detail: null, detailTrades: [],
  };

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = id => `<svg><use href="#${id}"/></svg>`;
  const tel = () => S.st?.telemetry;
  const can = what => ({ control: ['admin', 'trader'], admin: ['admin'] }[what] || []).includes(S.me?.role);
  const ago = () => S.st?.agent?.age == null ? null : S.st.agent.age + (Date.now() - S.fetchedAt) / 1000;
  const sum = (xs, f = x => x) => xs.reduce((a, x) => a + f(x), 0);

  // Deal and day-start times are broker server time encoded as epoch seconds, so they are shown as UTC.
  // Command times are real epoch; shifting them by the server's offset puts them on the same clock.
  const srvOffset = () => { const t = tel(); return t?.server_time && t?.sent_at ? Math.round((t.server_time - t.sent_at) / 900) * 900 : 0; };
  const fmtSrv = (ts, o = {}) => ts == null ? '–' : new Date(ts * 1000).toLocaleString('id-ID', { timeZone: 'UTC', ...o });
  const srvHms = ts => fmtSrv(ts, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const srvDay = ts => fmtSrv(ts, { day: '2-digit', month: 'short' });
  const srvDayTime = ts => fmtSrv(ts, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const dur = s => { s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}h ${h}j` : h ? `${h}j ${m}m` : `${m}m`; };

  // ---------- currency ----------
  // Amounts arrive in the account currency (USD, USC/USDc cent accounts, IDR) and are shown in the
  // currency the viewer picks. USD/IDR comes from the broker's USDIDR symbol when it has one,
  // otherwise from the rate the viewer enters in Settings. Both choices stay in this browser only.
  const pref = { get: k => { try { return localStorage.getItem('algodesk.' + k); } catch { return null; } },
                 set: (k, v) => { try { localStorage.setItem('algodesk.' + k, v); } catch {} } };
  const CURS = ['USD', 'USC', 'IDR'];
  S.cur = pref.get('cur');
  const normCur = c => { c = String(c || 'USD').toUpperCase(); return c.startsWith('USC') || c === 'USDC' ? 'USC' : c; };
  const brokerIdr = () => tel()?.fx?.usd_idr || 0;
  const manualIdr = () => parseFloat(pref.get('usdIdr')) || 0;
  const idrRate = () => brokerIdr() || manualIdr();
  const usdPer = c => c === 'USD' ? 1 : c === 'USC' ? 0.01 : c === 'IDR' && idrRate() ? 1 / idrRate() : null;
  const acctCur = () => normCur(tel()?.account?.currency);
  const viewCur = () => { const c = S.cur || acctCur(); return usdPer(c) && usdPer(acctCur()) ? c : acctCur(); };
  const conv = v => { const from = usdPer(acctCur()), to = usdPer(viewCur()); return from && to ? v * from / to : v; };
  const fmtNum = (v, sign) => {
    if (v == null || Number.isNaN(v)) return '–';
    const cur = viewCur(), x = conv(v), dec = cur === 'IDR' ? 0 : 2;
    return (x < 0 ? '−' : sign && x > 0 ? '+' : '') + Math.abs(x).toLocaleString(cur === 'IDR' ? 'id-ID' : 'en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  };
  const fmtMoney = (v, sign) => {
    if (v == null || Number.isNaN(v)) return '–';
    const cur = viewCur(), n = fmtNum(v, sign), s = /^[−+]/.test(n) ? n[0] : '', body = s ? n.slice(1) : n;
    return s + (cur === 'USD' ? '$' + body : cur === 'IDR' ? 'Rp ' + body : body + ' ' + cur);
  };
  const fmtAxis = v => {
    const cur = viewCur(), x = conv(v), a = Math.abs(x);
    const n = cur === 'IDR' ? (a >= 1e9 ? (x / 1e9).toFixed(2) + 'M' : (x / 1e6).toFixed(1) + 'jt')
      : a >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (x / 1e3).toFixed(1) + 'k' : x.toFixed(0);
    return n;
  };
  const fmtPx = (v, d = 2) => v == null ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, sign = true) => v == null || !isFinite(v) ? '–' : (v < 0 ? '−' : sign && v > 0 ? '+' : '') + Math.abs(v).toFixed(2) + '%';
  const cls = v => v < 0 ? 'down' : v > 0 ? 'up' : '';
  const symDigits = sym => tel()?.symbols?.find(s => s.symbol === sym)?.digits ?? (tel()?.positions?.find(p => p.symbol === sym)?.digits) ?? 2;

  async function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
    const r = await fetch('/api' + path, init);
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== '/auth/login') { showLogin(); throw new Error(j.detail || 'Sesi berakhir'); }
    if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Permintaan gagal (HTTP ' + r.status + ')');
    return j;
  }
  function toast(msg, kind = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind; el.textContent = msg;

  // ---------- small charts ----------

    const lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
    const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 2 - (v - lo) / sp * (h - 4)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    const id = 'sg' + Math.random().toString(36).slice(2, 8);
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${fill ? `<path d="${d}L${w},${h}L0,${h}Z" fill="url(#${id})"/>` : ''}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function ring(p, color = 'var(--up)') {
    const r = 26, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, p / 100));
    return `<div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="7"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/></svg></div>`;
  }
  const niceTicks = (min, max, n = 4) => {
    const span = Math.max(max - min, 1e-9), raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));

    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
    for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
    return { lo, hi, t };

    const wins = ts.filter(t => t.net > 0), losses = ts.filter(t => t.net < 0);
    const gp = sum(wins, t => t.net), gl = -sum(losses, t => t.net), net = sum(ts, t => t.net);

    const bal = tel()?.account?.balance || 0, startBal = bal - net;
    return { n: ts.length, wins: wins.length, losses: losses.length, gp, gl, net, dd, curve,
      wr: ts.length ? wins.length / ts.length * 100 : null, pf: gl ? gp / gl : null,
      avgW: wins.length ? gp / wins.length : null, avgL: losses.length ? -gl / losses.length : null,

  function logEvents() {

  // ---------- data loading ----------
  async function loadState() {
    const st = await api('/state');
    (st.telemetry?.symbols || []).forEach(s => { const h = S.hist[s.symbol] ||= []; if (h[h.length - 1] !== s.bid) h.push(s.bid); if (h.length > 60) h.shift(); });

    S.statsDay = day.eas; S.statsPer = per.eas; S.perStart = per.start; S.trades = tr.trades; S.tradesStart = tr.start; S.deals = dl.deals; S.dealsStart = dl.start;

    tickClock();
  }
  async function refreshAll() { try { await Promise.all([loadState(), loadStats(), loadEquity(), loadCmds()]); render(); toast('Data diperbarui.'); } catch (e) { toast(e.message, 'err'); } }

  async function sendCommand(body, label) {
    if (S.pending) return;
    try {
      const { id } = await api('/commands', { method: 'POST', body });
      S.pending = { id, label }; render();
      const started = Date.now();
      while (Date.now() - started < 130000) {
        await new Promise(r => setTimeout(r, 1000));
        const c = await api('/commands/' + id);
        if (c.status === 'pending') continue;
        S.pending = null;
        if (c.status === 'acked') toast(`${label}: ${c.result || 'dikonfirmasi agent'}`);
        else if (c.status === 'failed') toast(`${label} ditolak agent: ${c.result}`, 'err');
        else toast(`${label} kedaluwarsa: agent tidak merespons.`, 'err');
        await Promise.all([loadState(), loadCmds()]); render(); return;
      }
      S.pending = null; render();
    } catch (e) { S.pending = null; toast(e.message, 'err'); render(); }
  }
  // All EAs at once: one command per magic, applied by the agent on its next polls.
  async function bulkEa(on) {
    const ms = eaMagics().filter(m => eaOff(m) === on);
    if (!ms.length) { toast(on ? 'Semua EA sudah aktif.' : 'Semua EA sudah nonaktif.'); return; }
    try { for (const m of ms) await api('/commands', { method: 'POST', body: { type: on ? 'enable_magic' : 'disable_magic', magic: m } });
      toast(`${ms.length} perintah ${on ? 'aktifkan' : 'nonaktifkan'} EA dikirim ke agent.`); await loadCmds(); render(); }
    catch (e) { toast(e.message, 'err'); }
  }

      S.view = nav.dataset.view || nav.dataset.go; S.confirm = false; S.edit = null; window.scrollTo(0, 0);
      try { if (S.view === 'settings' || S.view === 'eas') await loadCmds(); if (S.view === 'users') await loadUsers();
        if (S.view === 'history') S.histTrades = (await api('/trades?days=' + S.histDays)).trades; } catch (err) { toast(err.message, 'err'); }
      render(); return;
    }
    const ub = e.target.closest('#userBtn'), menu = $('userMenu');
    if (ub) { menu.hidden = !menu.hidden; ub.setAttribute('aria-expanded', String(!menu.hidden)); return; }
    if (!e.target.closest('.user')) menu.hidden = true;
    const d = e.target.closest('[data-eq],[data-dp],[data-perf],[data-hsym]');
    if (d) {
      if (d.dataset.eq) S.eqTab = d.dataset.eq;
      if (d.dataset.dp) S.dpTab = d.dataset.dp;
      if (d.dataset.hsym) S.histSym = d.dataset.hsym;
      if (d.dataset.perf) { S.perfTab = d.dataset.perf; try { const r = await api('/eas/stats?period=' + S.perfTab); S.statsPer = r.eas; S.perStart = r.start; } catch (err) { toast(err.message, 'err'); } }
      render(); return;
    }
    const mg = e.target.closest('[data-magic]');
    if (mg && !mg.disabled) { const m = +mg.dataset.magic, off = eaOff(m); sendCommand({ type: off ? 'enable_magic' : 'disable_magic', magic: m }, `${off ? 'Start' : 'Stop'} ${eaLabel(m)}`); return; }
    const ed = e.target.closest('[data-edit]');
    if (ed && !ed.disabled) { S.edit = +ed.dataset.edit; render(); return; }
    const dt = e.target.closest('[data-detail]');
    if (dt) { S.detail = +dt.dataset.detail; S.detailTrades = []; render();
      try { S.detailTrades = (await api('/trades?days=30&magic=' + S.detail)).trades; } catch (err) { toast(err.message, 'err'); } render(); return; }
    const ua = e.target.closest('[data-uactive]');
    if (ua && !ua.disabled) { try { await api('/users/' + ua.dataset.uactive, { method: 'PATCH', body: { active: !ua.classList.contains('on') } }); await loadUsers(); toast('Status pengguna diperbarui.'); } catch (err) { toast(err.message, 'err'); } render(); return; }
    const actEl = e.target.closest('[data-act]'), act = actEl?.dataset.act; if (!act) return;
    if (act === 'closemodal') { if (e.target === actEl || actEl.tagName === 'BUTTON') { S.detail = null; render(); } return; }
    if (act === 'logout') { try { await api('/auth/logout', { method: 'POST', body: {} }); } catch (_) {} showLogin(); }
    if (act === 'refresh') refreshAll();
    if (act === 'allon' || act === 'alloff') bulkEa(act === 'allon');
    if (act === 'editcancel') { S.edit = null; render(); }
    if (act === 'logclear') { S.logEa = S.logSym = S.logEv = ''; render(); }
    if (act === 'pause') { S.confirm = true; render(); }
    if (act === 'cancel') { S.confirm = false; render(); }
    if (act === 'send') { S.confirm = false; const paused = tel()?.protection?.entry_state === 'paused'; sendCommand({ type: paused ? 'resume_entry' : 'pause_entry' }, paused ? 'Lanjutkan entry' : 'Jeda entry'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.detail != null) { S.detail = null; render(); } });
  document.addEventListener('change', async e => {
    const el = e.target, id = el.id;
    if (id === 'curSel') { S.cur = el.value; pref.set('cur', S.cur); }
    else if (id === 'fSym') S.sym = el.value;
    else if (id === 'fBkt') S.basketSym = el.value;
    else if (id === 'lEa') S.logEa = el.value;
    else if (id === 'lSym') S.logSym = el.value;
    else if (id === 'lEv') S.logEv = el.value;
    else if (id === 'fDays') { S.days = +el.value; el.blur(); try { await Promise.all([loadStats(), loadEquity()]); } catch (err) { toast(err.message, 'err'); } }
    else if (id === 'hDays') { S.histDays = +el.value; el.blur(); try { S.histTrades = (await api('/trades?days=' + S.histDays)).trades; } catch (err) { toast(err.message, 'err'); } }
    else if (el.closest('[data-urole]')) { const r = el.closest('[data-urole]'); try { await api('/users/' + r.dataset.urole, { method: 'PATCH', body: { role: r.value } }); await loadUsers(); toast('Peran diperbarui. Pengguna perlu login ulang.'); } catch (err) { toast(err.message, 'err'); } }
    else return;
    el.blur(); render();
  });
  document.addEventListener('input', e => {
    if (e.target.id !== 'hQ') return;
    S.histQ = e.target.value; const pos = e.target.selectionStart; render();
    const q = $('hQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  });
  document.addEventListener('submit', async e => {
    const f = e.target; if (f.id === 'loginForm') return;
    e.preventDefault();
    try {
      if (f.id === 'fxForm') { const v = parseFloat($('fxIn').value); if (!(v >= 1000)) throw new Error('Kurs tidak valid'); pref.set('usdIdr', String(v)); toast('Kurs disimpan'); }
      else if (f.id === 'limitForm') { const v = parseFloat($('limIn').value); $('limIn').blur(); await sendCommand({ type: 'set_limit', value: v }, `Ubah batas rugi ke ${v}%`); await loadCmds(); }
      else if (f.id === 'eaAdd') { await api('/eas/' + $('eaAddMagic').value, { method: 'PUT', body: { name: $('eaAddName').value, scope: '' } }); toast('EA didaftarkan.'); }
      else if (f.dataset.eaform) { const m = f.dataset.eaform; await api('/eas/' + m, { method: 'PUT', body: { name: $('ean-' + m).value, scope: $('eas-' + m).value } }); S.edit = null; toast('EA disimpan.'); }
      else if (f.id === 'userAdd') { await api('/users', { method: 'POST', body: { username: $('nu-user').value, display_name: $('nu-name').value, role: $('nu-role').value, password: $('nu-pw').value } }); await loadUsers(); toast('Pengguna ditambahkan.'); }
      else if (f.dataset.upw) { await api('/users/' + f.dataset.upw, { method: 'PATCH', body: { password: $('upw-' + f.dataset.upw).value } }); toast('Kata sandi diperbarui. Sesi pengguna itu diakhiri.'); }
      document.activeElement?.blur(); await loadState(); render();
    } catch (err) { toast(err.message, 'err'); }
  });

  api('/auth/me').then(showApp).catch(showLogin);
})();
</script>
</body>
</html>

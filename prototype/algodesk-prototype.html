<title>AlgoDesk MT5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: top bar + fixed sidebar + dense panel grid, dark trading-desk look taken from the AlgoDesk mock */
:root {
  color-scheme: dark;
  --bg: #0f1216;
  --panel: #151a20;
  --panel-2: #1a2027;
  --line: #252c35;
  --line-soft: #1e242c;
  --fg: #e7eaee;
  --fg-2: #b3bac4;
  --muted: #7d8695;
  --accent: #5fd3a4;
  --accent-bg: #173328;
  --up: #4fd39a;
  --up-bg: #12322a;
  --down: #f2697a;
  --down-bg: #3a1a22;
  --warn: #f2c14e;
  --warn-bg: #3a3016;
  --blue: #8aa4f8;
  --purple: #b18cf7;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef1f4; --panel: #ffffff; --panel-2: #f5f7f9; --line: #dde2e8; --line-soft: #e9edf1;
    --fg: #141a21; --fg-2: #3b4552; --muted: #6b7584;
    --accent: #128a5c; --accent-bg: #ddf3ea; --up: #12865a; --up-bg: #dcf2e8;
    --down: #cc2f45; --down-bg: #fbe3e7; --warn: #a8740a; --warn-bg: #fbefd2;
    --blue: #3d5fd6; --purple: #7a4bd8;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f5f7f9; --line: #dde2e8; --line-soft: #e9edf1;
  --fg: #141a21; --fg-2: #3b4552; --muted: #6b7584;
  --accent: #128a5c; --accent-bg: #ddf3ea; --up: #12865a; --up-bg: #dcf2e8;
  --down: #cc2f45; --down-bg: #fbe3e7; --warn: #a8740a; --warn-bg: #fbefd2;
  --blue: #3d5fd6; --purple: #7a4bd8;
}
* { box-sizing: border-box; }
svg { width: 16px; height: 16px; flex: none; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 16px; flex-wrap: wrap; color: var(--muted); display: flex; gap: 10px; flex: 1; min-width: 0; }
.crumb b { color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.demo { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.g { color: var(--up); } .dot.r { color: var(--down); } .dot.y { color: var(--warn); } .dot.b { color: var(--blue); } .dot.p { color: var(--purple); }
.user { position: relative; }
.user > button { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; text-align: left; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.user small { display: block; color: var(--muted); font-size: 12px; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; min-width: 220px; z-index: 20; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
.menu p { margin: 4px 8px 6px; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.menu button { display: flex; width: 100%; justify-content: space-between; background: none; border: 0; padding: 8px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--panel-2); }

/* shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100% - 65px); }
.side { border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 12px; margin: 0 4px 24px; font-weight: 700; letter-spacing: .12em; }
.brand i { font-style: normal; width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: #062a1c; display: grid; place-items: center; font-size: 18px; }
.brand span em { font-style: normal; color: var(--muted); }
.navh { font-size: 12px; letter-spacing: .14em; color: var(--muted); margin: 8px 6px 6px; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: var(--fg-2); background: none; border: 0; border-left: 2px solid transparent; cursor: pointer; text-align: left; width: 100%; }
.nav:hover { background: var(--panel-2); color: var(--fg); }
.nav.on { background: var(--accent-bg); color: var(--fg); border-left-color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .ct { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.navgroup { display: flex; flex-direction: column; gap: 4px; }
.vps { margin-top: auto; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--panel); }
.vps svg { width: 32px; height: 32px; color: var(--accent); flex: none; }
.vps b { display: block; font-size: 14px; }
.vps small { color: var(--fg-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.ver { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 14px 4px 0; }

main { padding-block: 28px 24px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.eyebrow { font-size: 13px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 20px; height: 1px; background: var(--muted); }
h1 { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }
.head p { margin: 0; color: var(--fg-2); }
.preview { text-align: right; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.preview span { flex-wrap: wrap; }
.preview .mono { letter-spacing: 0; color: var(--muted); font-size: 13px; text-transform: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.acct { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding: 14px 18px; }
.acct .it { display: flex; gap: 12px; align-items: center; }
.acct .it svg { width: 22px; height: 22px; color: var(--fg-2); flex: none; }
.acct b { font-weight: 600; font-size: 14px; display: block; }
.acct small { color: var(--fg-2); font-size: 13px; }
.acct .sep { width: 1px; align-self: stretch; background: var(--line); }
.acct .sync { margin-left: auto; color: var(--fg-2); font-size: 13px; display: flex; gap: 8px; align-items: center; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.kpi .lbl { display: flex; justify-content: space-between; color: var(--fg-2); }
.kpi .lbl svg { width: 20px; height: 20px; color: var(--muted); }
.kpi .val { font-family: var(--mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 14px; color: var(--fg-2); margin-left: 6px; }
.kpi .sub { color: var(--fg-2); font-size: 13px; display: flex; align-items: center; gap: 8px; }

.row { display: grid; gap: 12px; }
.r-mw { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.r-pos { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line-soft); }
.ph h2 { font-size: 15px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.ph p { margin: 4px 0 0 17px; color: var(--fg-2); font-size: 13px; }
.badge { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; color: var(--fg-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; cursor: pointer; color: var(--fg); white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.btn.ghost { background: none; border-color: transparent; }
.btn.primary { background: var(--accent); color: #062a1c; border-color: var(--accent); font-weight: 600; }
.btn.danger { background: var(--down-bg); color: var(--down); border-color: transparent; font-weight: 600; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
td { padding: 10px 18px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.sym { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.px { font-family: var(--mono); font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; transition: color .6s; }
.px .fu { color: var(--up); } .px .fd { color: var(--down); }
.struct { font-size: 13px; color: var(--fg-2); }
.struct b { font-weight: 500; }
.sig { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 4px; letter-spacing: .04em; }
.sig svg { width: 14px; height: 14px; }
.sig.buy { background: var(--up-bg); color: var(--up); }
.sig.sell { background: var(--down-bg); color: var(--down); }
.sig.none { background: var(--panel-2); color: var(--muted); }
.pf { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-soft); color: var(--fg-2); font-size: 13px; gap: 10px; flex-wrap: wrap; }
.pf .lnk { background: none; border: 0; color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.pf .lnk svg { width: 16px; height: 16px; }

/* protection */
.prot { padding-bottom: 18px; display: flex; flex-direction: column; }
.prot .ph { border-bottom: 0; }
.prot .body { padding: 0 18px; display: flex; flex-direction: column; gap: 14px; }
.state { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.active { color: var(--up); font-weight: 600; letter-spacing: .1em; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.active svg { width: 18px; height: 18px; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.pgrid small { color: var(--fg-2); font-size: 13px; }
.pgrid .num { font-size: 14px; font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--warn); border-radius: 3px; transition: width .6s; }
.bar.crit i { background: var(--down); }
.prow { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-2); gap: 8px; }
.note { display: flex; gap: 10px; color: var(--fg-2); font-size: 13px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--muted); }
.pause { width: 100%; justify-content: center; padding: 11px; font-size: 14px; }
.confirm { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.confirm div { display: flex; gap: 8px; justify-content: flex-end; }
.center { text-align: center; color: var(--muted); font-size: 13px; }

/* positions & EAs */
.pi { display: flex; gap: 12px; align-items: center; }
.pi .ic { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.pi .ic svg { width: 16px; height: 16px; }
.ic.b { background: var(--up-bg); color: var(--up); } .ic.s { background: var(--down-bg); color: var(--down); }
.pi b { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.pi .sd { font-size: 12px; color: var(--muted); margin-left: 8px; letter-spacing: .06em; }
.pi small { display: block; color: var(--fg-2); font-size: 13px; }
.mg { font-family: var(--mono); font-size: 13px; }
.mg small { display: block; font-family: var(--sans); color: var(--fg-2); }
.pl { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.ea { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); }
.ea .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.ea .ic svg { width: 18px; height: 18px; }
.ea b { font-weight: 600; display: block; }
.ea small { color: var(--fg-2); font-size: 13px; }
.ea .st { margin-left: auto; display: flex; gap: 14px; align-items: center; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.ea .st span { display: inline-flex; gap: 6px; align-items: center; font-family: var(--sans); font-size: 12px; letter-spacing: .08em; color: var(--fg-2); }
.lock { display: flex; gap: 10px; align-items: center; padding: 12px 18px; color: var(--fg-2); font-size: 13px; }
.lock svg { width: 16px; height: 16px; }

/* chart */
.chart { padding: 8px 18px 14px; }
.cw { position: relative; height: 170px; margin-left: 58px; }
.cw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.yl { position: absolute; left: -58px; font-family: var(--mono); font-size: 12px; color: var(--muted); transform: translateY(-50%); }
.xl { display: flex; justify-content: space-between; margin: 8px 0 0 58px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.endpt { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 25%, transparent); }
.agent .li { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line-soft); color: var(--fg-2); }
.agent .li:last-child { border-bottom: 0; }
.agent .li svg { width: 18px; height: 18px; flex: none; }
.agent .li span:last-child { margin-left: auto; color: var(--fg); }
.norm { color: var(--up); font-weight: 600; letter-spacing: .1em; font-size: 13px; display: flex; gap: 6px; align-items: center; }

.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--fg-2); font-size: 13px; }
.foot span { display: flex; gap: 8px; align-items: center; }

/* sim panel */
.sim { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px; border-style: dashed; }
.sim b { font-size: 13px; margin-right: auto; display: flex; gap: 8px; align-items: center; }

/* forms / generic */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 18px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg-2); }
input, select { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chip.g { background: var(--up-bg); color: var(--up); border-color: transparent; }
.chip.r { background: var(--down-bg); color: var(--down); border-color: transparent; }
.chip.y { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.log { font-family: var(--mono); font-size: 12px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--line); border: 0; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: left .2s; }
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 19px; background: #062a1c; }
.toggle[disabled] { opacity: .45; cursor: not-allowed; }
.pop { position: absolute; right: 18px; top: 56px; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 220px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
.rel { position: relative; }

.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100% - 32px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 24px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.err { border-left-color: var(--down); } .toast.wrn { border-left-color: var(--warn); }
@keyframes tin { from { transform: translateY(8px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .r-mw, .r-pos { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 4px; }
  .brand, .navh, .vps, .ver { display: none; }
  .navgroup { flex-direction: row; }
  .nav { width: auto; white-space: nowrap; padding: 8px 12px; border-left: 0; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .preview { align-items: flex-start; text-align: left; }
  .acct .sep { display: none; } .acct .sync { margin-left: 0; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .top .pill:not(.demo), .user small { display: none; }
  .crumb span.ws { display: none; }
  th, td { padding-left: 12px; padding-right: 12px; }
  .ea .st { flex-direction: column; align-items: flex-end; gap: 2px; }
}
</style>

    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

  <aside class="side">

    <div class="navh">Menu utama</div>
    <div class="navgroup">
      <button class="nav on" data-view="overview"><svg><use href="#i-grid"/></svg>Ringkasan</button>
      <button class="nav" data-view="market"><svg><use href="#i-candle"/></svg>Market Watch<span class="ct">12</span></button>

  </aside>

  <main id="main"></main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  // ---------- simulated data ----------
  const SYMS = [
    ['EURUSD', 1.08462, 5, 0.00001, 9, 56.8, 63.2, 'bull'],
    ['GBPUSD', 1.26750, 5, 0.00001, 12, 48.2, 74.8, 'mixed'],
    ['XAUUSD', 2678.32, 2, 0.01, 19, 42.6, 128.4, 'bear'],
    ['USDJPY', 154.238, 3, 0.001, 12, 54.1, 32.7, 'mixed'],
    ['NAS100', 20211.7, 1, 0.1, 14, 66.4, 183.2, 'bull'],
    ['AUDUSD', 0.65874, 5, 0.00001, 11, 51.3, 58.1, 'mixed'],
    ['USDCAD', 1.37952, 5, 0.00001, 14, 61.7, 66.0, 'bull'],
    ['USDCHF', 0.86311, 5, 0.00001, 13, 39.8, 61.5, 'bear'],
    ['NZDUSD', 0.59936, 5, 0.00001, 16, 47.5, 55.2, 'mixed'],
    ['EURJPY', 167.302, 3, 0.001, 18, 58.9, 88.4, 'bull'],
    ['GBPJPY', 195.511, 3, 0.001, 24, 44.1, 121.7, 'bear'],
    ['US30', 42180.5, 1, 0.1, 22, 52.6, 210.3, 'mixed'],
  ].map(([name, bid, digits, pt, spread, rsi, atr, struct]) => ({ name, bid, digits, pt, spread, rsi, atr, struct, dir: 0 }));
  const sym = n => SYMS.find(s => s.name === n);
  const ask = s => s.bid + s.spread * s.pt;

  const S = {
    view: 'overview', role: 'admin', tf: 'H1', rows: 5,
    balance: 10246.38, baseline: 10246.38, limitPct: 3.0, resetTz: 'server', telemetryEvery: 2,
    paused: false, pending: null, confirm: false, lastTelemetry: Date.now(), tick: 0, speed: 1,
    positions: [
      { id: 1, sym: 'EURUSD', side: 'BUY', lot: 0.02, sl: 1.08112, tp: 1.08920, magic: 260101, ea: 'AlgoDashboardAgent', pl0: -18.20, ref0: 1.08462, contract: 100000, pl: -18.20, open: '09:14' },
      { id: 2, sym: 'XAUUSD', side: 'SELL', lot: 0.01, sl: 2689.00, tp: 2657.20, magic: 180221, ea: 'EA Trend Demo', pl0: -24.79, ref0: 2678.51, contract: 100, pl: -24.79, open: '11:02' },
    ],
    closed: [
      { sym: 'GBPUSD', side: 'SELL', lot: 0.02, magic: 260101, pl: 14.60, time: '03:41' },
      { sym: 'XAUUSD', side: 'BUY', lot: 0.01, magic: 180221, pl: -9.85, time: '06:22' },
    ],
    eas: [
      { name: 'AlgoDashboardAgent', magic: 260101, scope: 'Multi-symbol · H1 · Demo', icon: 'i-bot', on: true, trades: 48, win: 56.3, pf: 1.42, net: 312.40, dd: 2.1 },
      { name: 'EA Trend Demo', magic: 180221, scope: 'XAUUSD · H1 · Demo', icon: 'i-pulse', on: true, trades: 31, win: 48.4, pf: 1.18, net: 96.75, dd: 3.4 },
    ],
    users: [
      { name: 'Administrator', email: 'admin@algodesk.local', role: 'Super Admin', last: 'Aktif sekarang' },
      { name: 'Operator Trading', email: 'trader@algodesk.local', role: 'Trader', last: '2 jam lalu' },
      { name: 'Auditor Risiko', email: 'audit@algodesk.local', role: 'Viewer', last: 'Kemarin' },
    ],
    audit: [],
    hist: [],
  };
  const ROLES = {
    admin: { label: 'Super Admin', name: 'Administrator', av: 'AD', control: true, admin: true },
    trader: { label: 'Trader', name: 'Operator Trading', av: 'OT', control: true, admin: false },
    viewer: { label: 'Viewer', name: 'Auditor Risiko', av: 'AR', control: false, admin: false },
  };

  // ---------- helpers ----------
  const fmtUsd = (v, sign) => (v < 0 ? '−' : sign && v > 0 ? '+' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtPx = (v, d) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const icon = (id, cls = '') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
  const nowWib = () => { const d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(11, 19); };
  const equity = () => S.balance + S.positions.reduce((a, p) => a + p.pl, 0);
  const lossLimit = () => S.baseline * S.limitPct / 100;
  const lossUsed = () => Math.max(0, S.baseline - equity());
  const blocked = () => lossUsed() >= lossLimit();
  const entryState = () => blocked() ? 'blocked' : S.paused ? 'paused' : 'allowed';
  const signal = s => (s.rsi >= 55 && s.struct === 'bull') ? 'BUY' : (s.rsi <= 45 && s.struct === 'bear') ? 'SELL' : null;
  const can = what => ROLES[S.role][what];

  function toast(msg, kind = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind; el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
  function log(action, result) {
    S.audit.unshift({ t: nowWib(), who: ROLES[S.role].name, role: ROLES[S.role].label, action, result });
  }

  // equity history: 96 points of 15 minutes ending at current equity
  (function seedHist() {
    let v = S.baseline; const pts = [];
    for (let i = 0; i < 96; i++) {
      const target = S.baseline - (i / 95) * 43 + Math.sin(i / 7) * 14 + Math.sin(i / 2.3) * 3;
      v = v + (target - v) * 0.6 + randn() * 1.2;
      pts.push(v);
    }
    const off = equity() - pts[95];
    S.hist = pts.map((p, i) => p + off * (i / 95));
  })();

  // ---------- render pieces ----------
  const structHtml = s => s.struct === 'bull' ? `<span class="struct"><b class="up">HH · HL</b> Bullish</span>`
    : s.struct === 'bear' ? `<span class="struct"><b class="down">LH · LL</b> Bearish</span>`
    : `<span class="struct"><b>MIXED</b> Netral</span>`;
  const sigHtml = s => { const g = signal(s); return g === 'BUY' ? `<span class="sig buy">${icon('i-up')}BUY</span>` : g === 'SELL' ? `<span class="sig sell">${icon('i-down')}SELL</span>` : `<span class="sig none">–</span>`; };
  const pxCls = s => s.dir > 0 ? 'fu' : s.dir < 0 ? 'fd' : '';

  function mwRows(list) {
    return list.map(s => `<tr>
      <td><div class="sym">${s.name}</div><div class="px"><span class="${pxCls(s)}">${fmtPx(s.bid, s.digits)}</span> / ${fmtPx(ask(s), s.digits)}</div>${structHtml(s)}</td>
      <td><div class="num">${s.rsi.toFixed(1)}</div><div class="muted" style="font-size:13px">ATR ${s.atr.toFixed(1)} pt</div></td>
      <td class="num">${s.spread} <span class="muted">pt</span></td>
      <td>${sigHtml(s)}</td></tr>`).join('');
  }

  function marketCard(full) {
    const list = full ? SYMS : SYMS.slice(0, S.rows);
    return `<section class="card rel">
      <div class="ph"><div><h2><span class="dot g"></span>Market Watch</h2><p>Semua simbol aktif · timeframe ${S.tf}</p></div>
      <button class="btn" data-act="cfg">${icon('i-tune')}Konfigurasi tampilan</button></div>
      ${S.cfgOpen ? `<div class="pop" id="cfgPop">
        <label>Timeframe sinyal<select id="tfSel">${['M15','H1','H4','D1'].map(t => `<option ${t===S.tf?'selected':''}>${t}</option>`).join('')}</select></label>
        <label>Baris di Ringkasan<select id="rowSel">${[5,8,12].map(n => `<option value="${n}" ${n===S.rows?'selected':''}>${n} simbol</option>`).join('')}</select></label>
        <button class="btn primary" data-act="cfgClose">Selesai</button></div>` : ''}
      <div class="tw"><table><thead><tr><th>Instrumen</th><th>RSI / ATR</th><th>Spread</th><th>Sinyal</th></tr></thead>
      <tbody id="mwBody">${mwRows(list)}</tbody></table></div>
      <div class="pf"><span style="display:flex;gap:8px;align-items:center"><span class="dot g"></span>12 simbol terlihat di Market Watch</span>
      ${full ? '' : `<button class="lnk" data-go="market">Buka semua simbol ${icon('i-arrow')}</button>`}</div>
    </section>`;
  }

  function protCard() {
    const st = entryState(), used = lossUsed(), lim = lossLimit(), pct = used / S.baseline * 100;
    const stLine = st === 'allowed' ? `<span class="dot g"></span>Entry baru diizinkan`
      : st === 'paused' ? `<span class="dot y"></span><span class="warn">Entry dijeda manual</span>`
      : `<span class="dot r"></span><span class="down">Batas tercapai, entry baru diblokir</span>`;
    let action;
    if (S.pending) action = `<button class="btn pause" disabled>${icon('i-sync')}Menunggu konfirmasi agent…</button>`;
    else if (S.confirm) action = `<div class="confirm"><span>${S.paused ? 'Kirim perintah <b>lanjutkan entry</b> ke agent VPS?' : 'Kirim perintah <b>jeda entry</b> ke semua EA di terminal ini? Posisi terbuka tidak ditutup.'}</span>
        <div><button class="btn" data-act="cancel">Batal</button><button class="btn primary" data-act="send">Kirim perintah</button></div></div>`;
    else if (st === 'blocked') action = `<button class="btn pause" disabled>${icon('i-lock')}Diblokir sampai reset harian</button>`;
    else action = `<button class="btn pause" data-act="pause" ${can('control') ? '' : 'disabled'}>${icon(S.paused ? 'i-play' : 'i-pause')}${S.paused ? 'Lanjutkan entry' : 'Jeda entry'}</button>`;
    return `<section class="card prot">
      <div class="ph"><div><h2><span class="dot y"></span>Proteksi harian</h2><p>Baseline equity awal hari server</p></div>
      <span class="active">${icon('i-shield')}AKTIF</span></div>
      <div class="body">
        <div class="state">${stLine}</div>
        <div class="pgrid"><small>Equity awal hari</small><small>Batas rugi</small>
          <span class="num">${fmtUsd(S.baseline)}</span><span class="num">${S.limitPct.toFixed(2)}% <span class="muted">(${fmtUsd(lim)})</span></span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="prow"><span>Penggunaan batas harian</span><span class="num" style="color:var(--fg)">${pct.toFixed(2)}% <span class="muted">/ ${S.limitPct.toFixed(2)}%</span></span></div>
          <div class="bar ${st === 'blocked' ? 'crit' : ''}"><i style="width:${Math.min(100, used / lim * 100).toFixed(1)}%"></i></div>
          <div class="prow"><span>Rugi tercatat <b class="num" style="color:var(--fg)">${fmtUsd(used)}</b></span><span>Sisa batas <b class="num" style="color:var(--fg)">${fmtUsd(Math.max(0, lim - used))}</b></span></div>
        </div>
        <div class="note">${icon('i-info')}<span>Proteksi memblokir entry baru saat batas tercapai. Posisi aktif tetap mengikuti SL/TP masing-masing EA.</span></div>
        ${action}
        <div class="center">${can('control') ? 'Perintah hanya dikirim melalui backend terautentikasi.' : 'Peran Viewer tidak dapat mengirim perintah.'}</div>
      </div></section>`;
  }

  function posRows() {
    if (!S.positions.length) return `<tr><td colspan="3" class="empty">Tidak ada posisi terbuka.</td></tr>`;
    return S.positions.map(p => { const s = sym(p.sym); return `<tr>
      <td><div class="pi"><span class="ic ${p.side === 'BUY' ? 'b' : 's'}">${icon(p.side === 'BUY' ? 'i-up' : 'i-down')}</span>
        <div><b>${p.sym}</b><span class="sd">${p.side}</span><small>${p.lot.toFixed(2)} lot · SL ${fmtPx(p.sl, s.digits)} · TP ${fmtPx(p.tp, s.digits)}</small></div></div></td>
      <td class="mg">${p.magic}<small>${p.ea}</small></td>
      <td class="r pl ${p.pl < 0 ? 'down' : 'up'}">${fmtUsd(p.pl, true)}</td></tr>`; }).join('');
  }
  function posCard() {
    return `<section class="card">
      <div class="ph"><div><h2><span class="dot b"></span>Posisi terbuka <span class="badge">${S.positions.length}</span></h2><p>Teridentifikasi menurut akun, simbol, dan Magic Number</p></div>
      <button class="btn" data-go="positions" aria-label="Buka halaman posisi">${icon('i-dots')}</button></div>
      <div class="tw"><table><thead><tr><th>Posisi</th><th>Magic Number</th><th class="r">P/L berjalan</th></tr></thead><tbody>${posRows()}</tbody></table></div></section>`;
  }

  function eaStatus(e) {
    if (!e.on) return `<span><span class="dot" style="color:var(--muted)"></span>NONAKTIF</span>`;
    const st = entryState();
    if (st === 'blocked') return `<span class="down"><span class="dot r"></span>DIBLOKIR</span>`;
    if (st === 'paused') return `<span class="warn"><span class="dot y"></span>DIJEDA</span>`;
    return `<span><span class="dot g"></span>AKTIF</span>`;
  }
  function eaCard() {
    return `<section class="card">
      <div class="ph"><div><h2><span class="dot p"></span>Instansi EA <span class="badge">${S.eas.length}</span></h2><p>Identitas strategi pada terminal ini</p></div>
      <button class="btn ghost" data-go="eas">Kelola ${icon('i-arrow')}</button></div>
      ${S.eas.map(e => `<div class="ea"><span class="ic" style="color:${e.icon === 'i-bot' ? 'var(--accent)' : 'var(--purple)'}">${icon(e.icon)}</span>
        <div><b>${e.name}</b><small>${e.scope}</small></div><div class="st">${e.magic} ${eaStatus(e)}</div></div>`).join('')}
      <div class="lock">${icon('i-lock')}Akses kontrol dikelola berdasarkan role pengguna.</div></section>`;
  }

  function chartCard() {
    const h = S.hist, min = Math.min(...h), max = Math.max(...h);
    const step = 20, lo = Math.floor((min - 4) / step) * step, hi = Math.ceil((max + 4) / step) * step;
    const W = 1000, H = 170, x = i => i / (h.length - 1) * W, y = v => H - (v - lo) / (hi - lo) * H;
    const line = h.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const ticks = []; for (let t = lo; t <= hi + 0.01; t += step) ticks.push(t);
    const thin = ticks.length > 5 ? ticks.filter((_, i) => i % 2 === 0) : ticks;
    const last = h[h.length - 1];
    return `<section class="card">
      <div class="ph" style="border-bottom:0"><div><h2><span class="dot b"></span>Equity hari ini</h2><p>Perubahan intrahari · USD · data simulasi</p></div>
      <span class="mono muted" style="font-size:13px">24 JAM</span></div>
      <div class="chart"><div class="cw">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Grafik equity 24 jam">
          <defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".22"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
          ${thin.map(t => `<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
          <line x1="0" x2="${W}" y1="${y(S.baseline)}" y2="${y(S.baseline)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".6"/>
          <path d="${line}L${W},${H}L0,${H}Z" fill="url(#eqg)"/>
          <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
        ${thin.map(t => `<span class="yl" style="top:${(y(t) / H * 100).toFixed(2)}%">$${(t / 1000).toFixed(2)}k</span>`).join('')}
        <span class="endpt" style="left:100%;top:${(y(last) / H * 100).toFixed(2)}%" title="${fmtUsd(last)}"></span>
      </div>
      <div class="xl"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>SEKARANG</span></div>
      <div class="muted" style="font-size:12px;margin:8px 0 0 58px;display:flex;gap:8px;align-items:center"><span style="width:14px;border-top:1px dashed var(--warn)"></span>Equity awal hari ${fmtUsd(S.baseline)}</div>
      </div></section>`;
  }

  function agentCard() {
    const ago = Math.max(0, Math.round((Date.now() - S.lastTelemetry) / 1000));
    return `<section class="card agent">
      <div class="ph"><div><h2><span class="dot g"></span>Status agent</h2><p>Windows VPS · terminal MT5</p></div><span class="norm"><span class="dot"></span>NORMAL</span></div>
      <div class="li">${icon('i-plug')}<span>Terminal MT5</span><span>Terhubung</span></div>
      <div class="li">${icon('i-shield')}<span>Kredensial agent</span><span>Terverifikasi</span></div>
      <div class="li">${icon('i-sync')}<span>Telemetri terakhir</span><span id="telAgo">${ago} detik lalu</span></div>
      <div class="li">${icon('i-lock')}<span>Kanal kontrol</span><span>HTTPS · RBAC</span></div></section>`;
  }

  function kpis() {
    const eq = equity(), pl = eq - S.baseline, mu = 2223.22, ml = eq / mu * 100;
    return `<div class="kpis">
      <div class="card kpi"><div class="lbl">Equity akun ${icon('i-wallet')}</div><div class="val">${fmtUsd(eq)}</div><div class="sub"><span class="dot b"></span>Balance <span class="num">${fmtUsd(S.balance)}</span></div></div>
      <div class="card kpi"><div class="lbl">P/L hari ini ${icon(pl < 0 ? 'i-down' : 'i-up')}</div><div class="val ${pl < 0 ? 'down' : 'up'}">${fmtUsd(pl, true)}</div><div class="sub"><span class="num ${pl < 0 ? 'down' : 'up'}">${(pl / S.baseline * 100).toFixed(2)}%</span> dari equity awal hari</div></div>
      <div class="card kpi"><div class="lbl">Margin bebas ${icon('i-coin')}</div><div class="val">${fmtUsd(eq - mu)}</div><div class="sub"><span class="dot g"></span>Margin level <span class="num">${ml.toFixed(1)}%</span></div></div>
      <div class="card kpi"><div class="lbl">Posisi terbuka ${icon('i-layers')}</div><div class="val">${String(S.positions.length).padStart(2, '0')}<small>posisi</small></div><div class="sub"><span class="dot g"></span>${new Set(S.positions.map(p => p.magic)).size} Magic Number terpantau</div></div>
    </div>`;
  }

  function simPanel() {
    return `<section class="card sim">
      <b>${icon('i-eye')}Panel simulasi prototipe</b>
      <button class="btn" data-act="speed">Kecepatan: ${S.speed}×</button>
      <button class="btn danger" data-act="shock">Simulasikan trade rugi $270</button>
      <button class="btn" data-act="reset">Reset hari (baseline baru)</button>
    </section>`;
  }

  const HEADS = {
    overview: ['Monitoring akun', 'Ringkasan', 'Pantau kondisi akun, simbol, dan perlindungan risiko dalam satu tempat.', 'Ikhtisar trading'],
    market: ['Data pasar', 'Market Watch', 'Harga, struktur pasar, RSI/ATR, dan sinyal untuk semua simbol yang terlihat.', 'Market Watch'],
    positions: ['Eksekusi', 'Posisi', 'Posisi terbuka dan riwayat hari ini, dikelompokkan menurut Magic Number.', 'Posisi'],
    eas: ['Strategi', 'Instansi EA', 'Aktifkan atau nonaktifkan EA per Magic Number pada terminal ini.', 'Instansi EA'],
    perf: ['Analitik', 'Performa', 'Statistik per strategi berdasarkan riwayat trade (data contoh).', 'Performa'],
    users: ['Administrasi', 'Pengguna & RBAC', 'Siapa yang bisa melihat dan siapa yang bisa mengirim perintah ke agent.', 'Pengguna & RBAC'],
    settings: ['Administrasi', 'Pengaturan', 'Parameter proteksi risiko, jadwal reset harian, dan log perintah.', 'Pengaturan'],
  };

  function head() {
    const [eb, h, p] = HEADS[S.view];
    return `<div class="head"><div><div class="eyebrow">${eb}</div><h1>${h}</h1><p>${p}</p></div>
      <div class="preview"><span style="display:flex;gap:8px;align-items:center">${icon('i-eye')}Pratinjau desain · Demo opt-in · Data simulasi</span>
      <span class="mono" style="display:flex;gap:6px;align-items:center">${icon('i-clock')}<span id="clock">${nowWib()}</span> UTC+7</span></div></div>`;
  }
  const acct = () => `<section class="card acct">
      <div class="it">${icon('i-bank')}<div><b>884921 · Akun Demo</b><small>Broker-Demo 01 • USD • Server Asia</small></div></div>
      <span class="sep"></span>
      <div class="it">${icon('i-shield')}<div><b>API terautentikasi</b><small>RBAC aktif · agent terdaftar</small></div></div>
      <span class="sync"><span class="dot g"></span>Sinkronisasi normal</span></section>`;
  const foot = () => `<div class="foot"><span><span class="dot b"></span>Semua nilai di layar ini merupakan data contoh untuk pratinjau desain.</span><span>AlgoDesk · MT5 Agent 0.10</span></div>`;

  function viewBody() {
    switch (S.view) {
      case 'overview': return acct() + kpis()
        + `<div class="row r-mw">${marketCard(false)}${protCard()}</div>`
        + `<div class="row r-pos">${posCard()}${eaCard()}</div>`
        + `<div class="row r-pos">${chartCard()}${agentCard()}</div>` + simPanel();
      case 'market': return marketCard(true);
      case 'positions': return kpis() + posCard() + `<section class="card"><div class="ph"><div><h2><span class="dot" style="color:var(--muted)"></span>Ditutup hari ini <span class="badge">${S.closed.length}</span></h2><p>Masuk ke balance dan ke perhitungan proteksi harian</p></div></div>
        <div class="tw"><table><thead><tr><th>Waktu</th><th>Simbol</th><th>Arah</th><th>Lot</th><th>Magic</th><th class="r">P/L</th></tr></thead><tbody>
        ${S.closed.map(c => `<tr><td class="num">${c.time}</td><td class="sym">${c.sym}</td><td>${c.side}</td><td class="num">${c.lot.toFixed(2)}</td><td class="num">${c.magic}</td><td class="r pl ${c.pl < 0 ? 'down' : 'up'}">${fmtUsd(c.pl, true)}</td></tr>`).join('')}
        </tbody></table></div></section>`;
      case 'eas': return `<section class="card">${S.eas.map((e, i) => `<div class="ea"><span class="ic" style="color:${e.icon === 'i-bot' ? 'var(--accent)' : 'var(--purple)'}">${icon(e.icon)}</span>
          <div><b>${e.name}</b><small>${e.scope} · Magic ${e.magic} · ${S.positions.filter(p => p.magic === e.magic).length} posisi terbuka</small></div>
          <div class="st">${eaStatus(e)}<button class="toggle ${e.on ? 'on' : ''}" data-ea="${i}" aria-label="Aktifkan ${e.name}" ${can('control') ? '' : 'disabled'}></button></div></div>`).join('')}
          <div class="lock">${icon('i-lock')}${can('control') ? 'Menonaktifkan EA hanya menghentikan entry baru dari Magic Number tersebut.' : 'Peran Viewer hanya dapat melihat status EA.'}</div></section>` + protCard();
      case 'perf': return `<section class="card"><div class="tw"><table><thead><tr><th>Strategi</th><th>Magic</th><th class="r">Trade</th><th class="r">Win rate</th><th class="r">Profit factor</th><th class="r">Max DD</th><th class="r">Net</th></tr></thead><tbody>
        ${S.eas.map(e => `<tr><td><b>${e.name}</b></td><td class="num">${e.magic}</td><td class="r num">${e.trades}</td><td class="r num">${e.win.toFixed(1)}%</td><td class="r num">${e.pf.toFixed(2)}</td><td class="r num">${e.dd.toFixed(1)}%</td><td class="r pl up">${fmtUsd(e.net, true)}</td></tr>`).join('')}
        </tbody></table></div><div class="pf">Contoh statistik 30 hari. Di versi nyata, angka dihitung backend dari riwayat deal MT5 per Magic Number.</div></section>` + chartCard();
      case 'users': return `<section class="card"><div class="tw"><table><thead><tr><th>Pengguna</th><th>Peran</th><th>Lihat dashboard</th><th>Kirim perintah</th><th>Kelola pengguna</th><th>Terakhir aktif</th></tr></thead><tbody>
        ${S.users.map(u => { const r = u.role; const yes = '<span class="chip g">Ya</span>', no = '<span class="chip">Tidak</span>';
          return `<tr><td><b>${u.name}</b><div class="muted" style="font-size:13px">${u.email}</div></td><td><span class="chip ${r === 'Super Admin' ? 'g' : r === 'Trader' ? 'y' : ''}">${r}</span></td><td>${yes}</td><td>${r === 'Viewer' ? no : yes}</td><td>${r === 'Super Admin' ? yes : no}</td><td class="muted">${u.last}</td></tr>`; }).join('')}
        </tbody></table></div><div class="pf">Ganti peran lewat menu profil di kanan atas untuk melihat perbedaan akses di prototipe ini.</div></section>`;
      case 'settings': return `<section class="card"><div class="ph"><div><h2><span class="dot y"></span>Proteksi harian</h2><p>Berlaku untuk semua EA di akun 884921</p></div></div>
        <form id="setForm" class="fgrid">
          <label>Batas rugi harian (% dari equity awal)<input id="limIn" type="number" min="0.5" max="20" step="0.1" value="${S.limitPct}" ${can('admin') ? '' : 'disabled'}></label>
          <label>Awal hari dihitung dari<select id="tzIn" ${can('admin') ? '' : 'disabled'}><option value="server" ${S.resetTz === 'server' ? 'selected' : ''}>Jam server broker (00:00)</option><option value="wib" ${S.resetTz === 'wib' ? 'selected' : ''}>UTC+7 (00:00 WIB)</option></select></label>
          <label>Interval telemetri agent<select id="telIn" ${can('admin') ? '' : 'disabled'}>${[1, 2, 5, 10].map(n => `<option value="${n}" ${n === S.telemetryEvery ? 'selected' : ''}>${n} detik</option>`).join('')}</select></label>
          <div style="display:flex;align-items:flex-end"><button class="btn primary" type="submit" ${can('admin') ? '' : 'disabled'}>Simpan pengaturan</button></div>
        </form>${can('admin') ? '' : '<div class="pf">Hanya Super Admin yang dapat mengubah pengaturan.</div>'}</section>
        <section class="card"><div class="ph"><div><h2><span class="dot b"></span>Log perintah</h2><p>Setiap perintah dicatat dengan pengirim, peran, dan konfirmasi agent</p></div></div>
        ${S.audit.length ? `<div class="tw"><table class="log"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Perintah</th><th>Hasil</th></tr></thead><tbody>
        ${S.audit.map(a => `<tr><td>${a.t}</td><td>${a.who} <span class="muted">(${a.role})</span></td><td>${a.action}</td><td>${a.result}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">Belum ada perintah hari ini. Coba tombol Jeda entry di Ringkasan.</div>`}</section>`;
    }
  }

  function render() {
    document.getElementById('main').innerHTML = head() + viewBody() + foot();
    document.getElementById('crumb').textContent = HEADS[S.view][3];
    document.getElementById('navPos').textContent = S.positions.length;
    document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.view === S.view));
  }

  // ---------- simulation ----------
  function step() {
    S.tick++;
    SYMS.forEach(s => {
      const prev = s.bid;
      s.bid = Math.max(s.pt, s.bid + randn() * s.atr * s.pt * 0.05);
      s.dir = Math.sign(s.bid - prev);
      s.rsi = Math.min(85, Math.max(15, s.rsi + randn() * 0.6 + (50 - s.rsi) * 0.01));
      if (Math.random() < 0.004) s.struct = ['bull', 'bear', 'mixed'][Math.floor(Math.random() * 3)];
    });
    for (const p of [...S.positions]) {
      const s = sym(p.sym), px = p.side === 'BUY' ? s.bid : ask(s);
      p.pl = p.pl0 + (p.side === 'BUY' ? 1 : -1) * (px - p.ref0) * p.lot * p.contract;
      const hitSl = p.side === 'BUY' ? px <= p.sl : px >= p.sl, hitTp = p.side === 'BUY' ? px >= p.tp : px <= p.tp;
      if (hitSl || hitTp) {
        S.positions = S.positions.filter(q => q !== p);
        S.balance += p.pl;
        S.closed.unshift({ sym: p.sym, side: p.side, lot: p.lot, magic: p.magic, pl: p.pl, time: nowWib().slice(0, 5) });
        toast(`${p.sym} ${p.side} ditutup oleh ${hitTp ? 'TP' : 'SL'}: ${fmtUsd(p.pl, true)}`, p.pl < 0 ? 'err' : '');
      }
    }
    const wasBlocked = S.wasBlocked; S.wasBlocked = blocked();
    if (S.wasBlocked && !wasBlocked) { toast('Batas rugi harian tercapai. Entry baru diblokir untuk semua EA.', 'err'); log('Blokir otomatis (batas rugi)', 'Dikonfirmasi agent'); }
    S.hist[S.hist.length - 1] = equity();
    if (S.tick % 20 === 0) { S.hist.shift(); S.hist.push(equity()); }
    if (S.tick % S.telemetryEvery === 0 || S.telemetryEvery <= 1) S.lastTelemetry = Date.now();
    if (!S.cfgOpen && !document.activeElement?.matches('input,select')) render();
  }
  let timer = setInterval(step, 1500);
  setInterval(() => {
    const c = document.getElementById('clock'); if (c) c.textContent = nowWib();
    const t = document.getElementById('telAgo'); if (t) t.textContent = Math.round((Date.now() - S.lastTelemetry) / 1000) + ' detik lalu';
  }, 1000);

  // ---------- events ----------
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-view]'); if (nav) { S.view = nav.dataset.view; S.cfgOpen = false; render(); window.scrollTo(0, 0); return; }
    const go = e.target.closest('[data-go]'); if (go) { S.view = go.dataset.go; render(); window.scrollTo(0, 0); return; }
    const ub = e.target.closest('#userBtn'), menu = document.getElementById('userMenu');
    if (ub) { menu.hidden = !menu.hidden; ub.setAttribute('aria-expanded', String(!menu.hidden)); return; }
    const rb = e.target.closest('[data-role]');
    if (rb) { S.role = rb.dataset.role; const r = ROLES[S.role];
      document.getElementById('uname').textContent = r.name; document.getElementById('urole').textContent = 'Peran: ' + r.label; document.getElementById('avatar').textContent = r.av;
      menu.hidden = true; S.confirm = false; render(); toast('Melihat sebagai ' + r.label); return; }
    if (!e.target.closest('.user')) menu.hidden = true;
    const ea = e.target.closest('[data-ea]');
    if (ea && can('control')) { const x = S.eas[+ea.dataset.ea]; x.on = !x.on; log(`${x.on ? 'Aktifkan' : 'Nonaktifkan'} EA ${x.magic}`, 'Dikonfirmasi agent'); toast(`${x.name} ${x.on ? 'diaktifkan' : 'dinonaktifkan'}`); render(); return; }
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    if (act === 'cfg') { S.cfgOpen = !S.cfgOpen; render(); }
    if (act === 'cfgClose') { S.cfgOpen = false; render(); }
    if (act === 'pause') { S.confirm = true; render(); }
    if (act === 'cancel') { S.confirm = false; render(); }
    if (act === 'send') {
      S.confirm = false; S.pending = S.paused ? 'resume' : 'pause'; render();
      setTimeout(() => { const resume = S.pending === 'resume'; S.paused = !resume; S.pending = null;
        log(resume ? 'Lanjutkan entry' : 'Jeda entry', 'Dikonfirmasi agent'); toast(resume ? 'Entry dilanjutkan. Agent mengonfirmasi.' : 'Entry dijeda. Agent mengonfirmasi, posisi terbuka tetap berjalan.', resume ? '' : 'wrn'); render(); }, 1300);
    }
    if (act === 'shock') { S.balance -= 270; S.closed.unshift({ sym: 'GBPJPY', side: 'BUY', lot: 0.05, magic: 260101, pl: -270, time: nowWib().slice(0, 5) }); toast('Simulasi: GBPJPY BUY ditutup −$270.00', 'err'); step(); }
    if (act === 'reset') { S.baseline = equity(); S.paused = false; S.wasBlocked = false; log('Reset baseline harian', 'Baseline ' + fmtUsd(S.baseline)); toast('Hari baru dimulai. Baseline equity ' + fmtUsd(S.baseline)); render(); }
    if (act === 'speed') { S.speed = S.speed === 1 ? 3 : 1; clearInterval(timer); timer = setInterval(step, 1500 / S.speed); render(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'tfSel') { S.tf = e.target.value; render(); }
    if (e.target.id === 'rowSel') { S.rows = +e.target.value; render(); }
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'setForm') return; e.preventDefault();
    const v = parseFloat(document.getElementById('limIn').value);
    if (!(v >= 0.5 && v <= 20)) { toast('Batas rugi harus antara 0,5% dan 20%.', 'err'); return; }
    S.limitPct = v; S.resetTz = document.getElementById('tzIn').value; S.telemetryEvery = +document.getElementById('telIn').value;
    log(`Ubah batas rugi ke ${v.toFixed(2)}%`, 'Disimpan backend'); toast('Pengaturan disimpan.'); document.activeElement.blur(); render();
  });

  render();
})();
</script>
